<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPGA Bank Voltage Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:#fff;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.bank{padding:18px;border-radius:14px;background:#eef5ff}.row{display:grid;grid-template-columns:180px 1fr;gap:14px;margin:14px 0}select{font-size:16px;padding:8px}.ok{border-left:6px solid #4d9965}.bad{border-left:6px solid #c94b4b}</style></head><body><h1>FPGA Bank Voltage Lab</h1><p>把接口放进同一个 Bank，观察 VCCO 冲突。教学模型，不替代 Vivado DRC / UG471。</p><div class="card"><div class="row"><label>Bank VCCO</label><select id="v"><option value="3.3">3.3 V</option><option value="1.8">1.8 V</option><option value="1.5">1.5 V</option></select></div><div class="row"><label>接口 A</label><select id="a"><option value="3.3">LVCMOS33</option><option value="1.8">LVCMOS18</option><option value="1.5">DDR3 SSTL15</option></select></div><div class="row"><label>接口 B</label><select id="b"><option value="1.5">DDR3 SSTL15</option><option value="3.3">LVCMOS33</option><option value="1.8">LVCMOS18</option></select></div></div><div id="out" class="card"></div><script>["v","a","b"].forEach(x=>document.getElementById(x).onchange=go);function go(){let v=document.getElementById("v").value,a=document.getElementById("a").value,b=document.getElementById("b").value,ok=a===v&&b===v;out.className="card "+(ok?"ok":"bad");out.innerHTML=ok?"<b>电压层面兼容。</b><br>仍需检查具体 IOSTANDARD、VREF、pin type、clock/diff/memory rules。":"<b>Bank 级 VCCO 冲突。</b><br>同一个物理 Bank 不能靠 XDC 文本同时变成 "+a+" V 和 "+b+" V。";}go()</script></body></html>
