<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V2 Release Gate Lab</title><style>body{font-family:system-ui,"Noto Sans SC",sans-serif;max-width:980px;margin:34px auto;padding:0 20px;color:#172033}h1{font-size:30px}.row{display:grid;grid-template-columns:28px 1fr 170px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #e2e8f0}.panel{border:1px solid #cbd5e1;border-radius:14px;padding:16px}.score{font-size:36px;font-weight:800}.bad{color:#dc2626}.warn{color:#d97706}.good{color:#16a34a}select{padding:6px}small{color:#64748b}</style><h1>STM32F407 V2｜Release Gate Lab</h1><p>训练：DRC PASS 只是 release 的一项。把每个 gate 的证据状态设出来，看看“能不能下单”。</p><div class="panel" id="list"></div><p class="score" id="score"></p><p id="decision"></p><small>教学工具，不替代实际公司质量流程、板厂 CAM review 或正式设计签核。</small><script>const items=[['Schematic/ERC','power/VCAP/USB/CAN/SDIO 人工 Review'],['PCB DRC','DRC 与 waiver 有记录'],['SI','USB/SDIO/reference/via 人工审查'],['PI','decoupling/3V3/thermal/transient'],['EMC/ESD','connector protection/cable/common-mode'],['DFM','stackup/footprint/drill/mechanical'],['BOM/DNP','料号、替代、默认装配'],['Testability','SWD/power/measurement access'],['Gerber/Drill','独立 viewer 检查'],['Traceability','Git commit/BOM/release revision']];const list=document.getElementById('list');items.forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<b>${i+1}</b><span><b>${x[0]}</b><br><small>${x[1]}</small></span><select id="s${i}"><option value="0">未检查</option><option value="0.5">有检查但无证据</option><option value="1">PASS + evidence</option></select>`;list.appendChild(r)});function calc(){let vals=items.map((_,i)=>+document.getElementById('s'+i).value),sum=vals.reduce((a,b)=>a+b,0),score=Math.round(sum/items.length*100),block=vals.some(v=>v===0);let e=document.getElementById('score'),d=document.getElementById('decision');e.textContent=score+'/100';e.className='score '+(score>=90&&!block?'good':score>=65?'warn':'bad');d.textContent=block?'NO RELEASE：至少一个关键 gate 完全未检查。':score>=90?'可以进入正式 release review：仍需检查 waiver/风险。':'HOLD：证据链不完整，不要因为“板子看起来画完了”就下单。'}items.forEach((_,i)=>document.getElementById('s'+i).onchange=calc);calc();</script></html>
