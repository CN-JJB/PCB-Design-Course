<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDR3 Byte Lane Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:white;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lane{padding:20px;border-radius:14px;background:#f4efff}.lane:nth-child(2){background:#eef9f1}.chip{display:inline-block;padding:8px 12px;margin:5px;border-radius:10px;background:white;border:1px solid #aab9ca}.bad{border-left:6px solid #c84b4b}.ok{border-left:6px solid #4d9965}button{padding:10px 14px;margin:6px;font-size:15px}</style></head><body><h1>DDR3 Byte-Lane Lab</h1><p>模拟 x16 DDR3 的两个 byte lane。重点：DQS、DQ、DM 的 membership 由 FPGA memory resources / MIG rules 约束。</p><div class="lanes"><div class="lane"><b>Byte Lane 0</b><div>DQS0 ±</div><div id="l0"></div></div><div class="lane"><b>Byte Lane 1</b><div>DQS1 ±</div><div id="l1"></div></div></div><div class="card"><button onclick="move()">把 DQ7 从 Lane0 移到 Lane1</button><button onclick="reset()">恢复 MIG 合法分组</button></div><div id="out" class="card ok"></div><script>let bad=false;function draw(){l0.innerHTML="";l1.innerHTML="";for(let i=0;i<8;i++){let d=document.createElement("span");d.className="chip";d.textContent="DQ"+i;(bad&&i===7?l1:l0).appendChild(d)}for(let i=8;i<16;i++){let d=document.createElement("span");d.className="chip";d.textContent="DQ"+i;l1.appendChild(d)}out.className="card "+(bad?"bad":"ok");out.innerHTML=bad?"<b>逻辑编号仍然叫 DQ7，但物理 byte-lane membership 已被破坏。</b><br>真实项目必须回 MIG / Vivado 验证合法 swap，不能只在 KiCad 改 net label。":"<b>合法教学状态：</b>DQ0..7 跟 DQS0，DQ8..15 跟 DQS1；DM 也应属于对应 byte group。"}function move(){bad=true;draw()}function reset(){bad=false;draw()}draw()</script></body></html>
