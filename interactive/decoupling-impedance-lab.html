<!doctype html><meta charset="utf-8"><title>Decoupling Impedance Lab</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 18px;color:#222}label{display:block;margin:14px 0}.box{padding:18px;border:1px solid #ddd;border-radius:14px;background:#fafafa}svg{width:100%;height:340px;border:1px solid #eee;background:white}.n{font-variant-numeric:tabular-nums;font-weight:700}</style><h1>Decoupling Impedance Lab</h1><p>教学用一阶模型：<code>Z = ESR + jω(L_ESL+L_mount) + 1/(jωC)</code>。它用于建立趋势直觉，不等于具体 MLCC 厂商模型。</p><div class="box"><label>C: <span id="cv" class="n"></span> nF <input id="c" type="range" min="10" max="10000" value="100" step="10"></label><label>ESR: <span id="rv" class="n"></span> mΩ <input id="r" type="range" min="2" max="200" value="20"></label><label>Component ESL: <span id="lv" class="n"></span> nH <input id="l" type="range" min="0.1" max="5" value="0.8" step="0.1"></label><label>Mounting L: <span id="mv" class="n"></span> nH <input id="m" type="range" min="0" max="10" value="1.5" step="0.1"></label><p>Estimated SRF: <span id="srf" class="n"></span> MHz</p></div><svg id="g" viewBox="0 0 800 340"></svg><script>const $=x=>document.getElementById(x),ids=['c','r','l','m'];function draw(){let C=+$('c').value*1e-9,R=+$('r').value/1000,L=(+$('l').value + +$('m').value)*1e-9;$('cv').textContent=$('c').value;$('rv').textContent=$('r').value;$('lv').textContent=$('l').value;$('mv').textContent=$('m').value;$('srf').textContent=(1/(2*Math.PI*Math.sqrt(L*C))/1e6).toFixed(2);let pts=[];for(let i=0;i<240;i++){let f=10**(3+i/239*7),w=2*Math.PI*f,x=w*L-1/(w*C),z=Math.sqrt(R*R+x*x),X=60+i/239*700,Y=300-(Math.log10(z)+4)/6*250;pts.push(X+','+Y)}$('g').innerHTML='<line x1="55" y1="300" x2="770" y2="300" stroke="#333"/><line x1="55" y1="40" x2="55" y2="300" stroke="#333"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#6f42c1" stroke-width="4"/><text x="60" y="25">|Z| trend</text><text x="680" y="325">1 kHz → 10 GHz</text>'}ids.forEach(i=>$(i).oninput=draw);draw()</script>
