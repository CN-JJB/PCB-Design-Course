<!doctype html><meta charset="utf-8"><title>Buck Hot Loop Lab</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 18px;color:#222}.card{border:1px solid #ddd;border-radius:14px;padding:18px;background:#fafafa}label{display:block;margin:16px 0}.board{height:330px;position:relative;background:#eef2e7;border-radius:16px;overflow:hidden}.x{position:absolute;border:2px solid #555;border-radius:9px;padding:10px;background:white}.loop{position:absolute;border:6px solid #d33;border-radius:35px;transition:.2s}.sw{background:#ffeef2}.meter{font-size:1.7rem;font-weight:800;color:#6f42c1}</style><h1>Buck Hot Loop Lab</h1><p>教学趋势模型：调整输入电容距离、回流长度和 SW 铜面积，观察“寄生/EMI 风险指数”。不等同于开关电源电磁仿真。</p><div class="card"><label>Input capacitor distance: <span id="dv"></span> mm <input id="d" type="range" min="1" max="35" value="4"></label><label>Ground return extra length: <span id="gv"></span> mm <input id="g" type="range" min="0" max="40" value="3"></label><label>SW copper area factor: <span id="av"></span> <input id="a" type="range" min="1" max="10" value="2"></label><p>Teaching risk index: <span id="risk" class="meter"></span></p></div><div class="board" id="b"><div class="x" style="left:380px;top:105px">Converter</div><div class="x sw" style="left:530px;top:105px">SW</div><div class="x" id="cin" style="top:110px">CIN</div><div class="loop" id="loop"></div></div><script>const $=x=>document.getElementById(x);function u(){let d=+$('d').value,g=+$('g').value,a=+$('a').value;$('dv').textContent=d;$('gv').textContent=g;$('av').textContent=a;let left=380-d*7,w=80+d*7,h=95+g*2;$('cin').style.left=(left-70)+'px';let L=$('loop');L.style.left=(left-20)+'px';L.style.top=(92-g)+'px';L.style.width=w+'px';L.style.height=h+'px';$('risk').textContent=(d*1.4+g*1.1+a*3).toFixed(1)}['d','g','a'].forEach(x=>$(x).oninput=u);u()</script>
