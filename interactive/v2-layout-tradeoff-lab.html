<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V2 Layout Trade-off Lab</title><style>body{font-family:system-ui,"Noto Sans SC",sans-serif;max-width:1000px;margin:36px auto;padding:0 20px;color:#172033}h1{font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #cbd5e1;border-radius:14px;padding:18px;background:#fff}.risk{font-size:30px;font-weight:800}.bar{height:16px;background:#e2e8f0;border-radius:8px;overflow:hidden}.fill{height:100%;background:currentColor}.note{background:#f8fafc;padding:14px;border-radius:12px}label{display:block;margin:16px 0}input{width:100%}small{color:#64748b}</style><h1>STM32F407 V2｜Layout Trade-off Lab</h1><p>这是教学趋势模型：用“相对距离/复杂度”理解 Placement 如何影响后续 SI/PI/EMC。它不是 field solver，也不是 KiCad DRC。</p><div class="grid"><div class="card"><h2>你来调整</h2><label>USB 路径复杂度 <b id="uV"></b><input id="usb" type="range" min="0" max="100" value="25"></label><label>SDIO 路径复杂度 <b id="sV"></b><input id="sd" type="range" min="0" max="100" value="35"></label><label>CAN 连接器边界绕行 <b id="cV"></b><input id="can" type="range" min="0" max="100" value="20"></label><label>3V3 分配窄颈/绕行 <b id="pV"></b><input id="pwr" type="range" min="0" max="100" value="30"></label><label>调试/机械不可达程度 <b id="dV"></b><input id="dbg" type="range" min="0" max="100" value="15"></label></div><div class="card"><h2>综合风险</h2><div class="risk" id="total">—</div><div class="bar"><div class="fill" id="totalbar"></div></div><p id="msg"></p><h3>域风险</h3><p>SI <b id="si"></b></p><p>PI <b id="pi"></b></p><p>EMC <b id="emc"></b></p><p>DFM/Test <b id="dfm"></b></p></div></div><div class="note"><b>练习：</b>先把 USB 调到最低风险，再观察你是否把 SDIO、CAN 或 Debug 推高。真正 Placement 不是把某一个指标做到极致，而是让整个系统的高风险结构都可控。</div><script>const q=id=>document.getElementById(id);const ids=['usb','sd','can','pwr','dbg'];function calc(){let v={};ids.forEach(id=>{v[id]=+q(id).value;q(id[0]+'V').textContent=v[id]});let si=.36*v.usb+.38*v.sd+.12*v.can+.08*v.pwr+.06*v.dbg;let pi=.08*v.usb+.22*v.sd+.08*v.can+.55*v.pwr+.07*v.dbg;let emc=.28*v.usb+.18*v.sd+.36*v.can+.12*v.pwr+.06*v.dbg;let dfm=.08*v.usb+.08*v.sd+.12*v.can+.12*v.pwr+.60*v.dbg;let total=(si+pi+emc+dfm)/4;[['si',si],['pi',pi],['emc',emc],['dfm',dfm]].forEach(([a,b])=>q(a).textContent=b.toFixed(0));q('total').textContent=total.toFixed(0)+'/100';q('totalbar').style.width=total+'%';q('totalbar').style.color=total<30?'#16a34a':total<55?'#f59e0b':'#dc2626';q('msg').textContent=total<30?'布局风险较均衡：继续做真实 current/reference review。':total<55?'有明显 trade-off：找出最高风险域，回到 floorplan。':'不要用 Routing 硬救：优先重做 Placement / zoning。'}ids.forEach(id=>q(id).oninput=calc);calc();</script></html>
