<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Common-Mode Cable Lab</title><style>body{font-family:system-ui;max-width:920px;margin:32px auto;padding:0 20px;line-height:1.6}label{display:block;margin:16px 0}input{width:100%}.card{border:1px solid #ccc;border-radius:12px;padding:18px;margin:18px 0}.bar{height:24px;background:#d33;border-radius:8px}.big{font-size:28px;font-weight:700}</style><h1>Common-Mode Cable Lab</h1><p>趋势模型：观察 common-mode current、频率和线缆电尺寸如何共同影响辐射风险。不是认证限值预测器。</p><label>Common-mode current：<span id="iv">100</span> µA<input id="i" type="range" min="1" max="1000" value="100"></label><label>Frequency：<span id="fv">150</span> MHz<input id="f" type="range" min="10" max="1000" value="150"></label><label>Cable length：<span id="lv">0.5</span> m<input id="l" type="range" min="0.05" max="2" step="0.05" value="0.5"></label><div class="card"><div>自由空间波长 λ ≈ <b id="lam"></b> m；线缆长度约为 λ 的 <b id="ratio"></b></div><div>教学风险指数：</div><div class="bar" id="bar"></div><div class="big" id="risk"></div></div><div class="card"><b>重点：</b><ul><li>很小的共模电流也可能因为长电缆成为高效辐射结构。</li><li>线缆长度改变后频谱变化，是“电缆参与辐射”的强线索，不等于根因就在接口芯片。</li><li>最终仍要追 Source → Coupling → Antenna → Return。</li></ul></div><script>let I=i,F=f,L=l;function u(){let mhz=+F.value,ma=300/mhz,r=+L.value/ma,idx=Math.min(100,(+I.value/10)*Math.min(3,r*4));iv.textContent=I.value;fv.textContent=F.value;lv.textContent=(+L.value).toFixed(2);lam.textContent=ma.toFixed(2);ratio.textContent=r.toFixed(2);bar.style.width=idx+'%';risk.textContent=idx<25?'低到中等趋势':idx<60?'需要关注':'高风险趋势（仅教学）'}[I,F,L].forEach(x=>x.oninput=u);u()</script></html>
