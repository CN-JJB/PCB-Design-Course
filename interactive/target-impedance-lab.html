<!doctype html><meta charset="utf-8"><title>Target Impedance Lab</title><style>body{font-family:system-ui;max-width:850px;margin:32px auto;padding:0 18px;color:#222}.card{padding:18px;border:1px solid #ddd;border-radius:14px;background:#fafafa}label{display:block;margin:15px 0}.big{font-size:2rem;font-weight:800;color:#6f42c1}.note{color:#666}</style><h1>Target Impedance Lab</h1><p>用最简单的 <code>Ztarget ≈ ΔVallowed / ΔItransient</code> 建立设计直觉。真正项目若有芯片厂商定义的频域 target，应优先使用厂商要求。</p><div class="card"><label>Rail voltage: <span id="vv"></span> V <input id="v" type="range" min="0.6" max="5" value="3.3" step="0.1"></label><label>Allowed ripple: <span id="pv"></span>% <input id="p" type="range" min="0.2" max="10" value="3" step="0.1"></label><label>Transient current: <span id="iv"></span> A <input id="i" type="range" min="0.05" max="5" value="0.2" step="0.05"></label><label>Definition / margin factor: <span id="fv"></span> <input id="f" type="range" min="0.5" max="2" value="1" step="0.05"></label><p>Allowed ΔV = <b id="dv"></b> mV</p><p>Teaching Ztarget = <span class="big" id="z"></span></p></div><p class="note">观察：rail 越低、允许纹波越小、瞬态电流越大，要求的 PDN 阻抗越低。</p><script>const $=x=>document.getElementById(x),a=['v','p','i','f'];function u(){let V=+$('v').value,P=+$('p').value,I=+$('i').value,F=+$('f').value,d=V*P/100,Z=d/(I*F);$('vv').textContent=V.toFixed(1);$('pv').textContent=P.toFixed(1);$('iv').textContent=I.toFixed(2);$('fv').textContent=F.toFixed(2);$('dv').textContent=(d*1000).toFixed(1);$('z').textContent=Z>=1?Z.toFixed(2)+' Ω':(Z*1000).toFixed(1)+' mΩ'}a.forEach(x=>$(x).oninput=u);u()</script>
