<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ESD Layout Lab</title><style>body{font-family:system-ui;max-width:900px;margin:32px auto;padding:0 20px;line-height:1.6}label{display:block;margin:18px 0}.card{border:1px solid #ccc;border-radius:12px;padding:18px;margin:18px 0;background:#fafafa}.big{font-size:32px;font-weight:700}input{width:100%}.warn{color:#b00020}</style><h1>ESD Layout Lab</h1><p>教学模型：观察 discharge-path inductance 在高 <code>di/dt</code> 下如何抬高额外电压。不是整机 IEC 仿真。</p><label>路径等效电感 L：<span id="lv">1.0</span> nH<input id="l" type="range" min="0.1" max="10" step="0.1" value="1"></label><label>电流上升速度 di/dt：<span id="dv">30</span> A/ns<input id="d" type="range" min="1" max="50" step="1" value="30"></label><div class="card"><div>仅由路径电感产生的附加电压：</div><div class="big warn" id="v"></div><p><code>V = L · di/dt</code></p></div><div class="card"><b>观察：</b><ul><li>TVS 器件型号不变，路径电感变大时系统看到的瞬态电压仍会上升。</li><li>“TVS 离连接器近”只是降低完整路径电感的一部分。</li><li>泄放 via、铜颈、chassis/reference 连接同样重要。</li></ul></div><script>let l=document.querySelector('#l'),d=document.querySelector('#d');function f(){lv.textContent=(+l.value).toFixed(1);dv.textContent=d.value;v.textContent=((+l.value)*(+d.value)).toFixed(1)+' V'}l.oninput=d.oninput=f;f()</script></html>
