<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECO Impact Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:white;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}button{padding:12px;margin:7px;font-size:15px}.tag{display:inline-block;padding:8px 12px;margin:5px;border-radius:10px;background:#eef5ff}.warn{background:#fff0f0;border-left:6px solid #c94b4b}</style></head><body><h1>ECO Impact Lab</h1><p>同样是“换一个料”，影响范围可能完全不同。选择变更查看需要重开的 Review。</p><div class="card"><button onclick="show('r')">换普通上拉电阻</button><button onclick="show('osc')">换晶振/振荡器</button><button onclick="show('ldo')">换 LDO</button><button onclick="show('ddr')">换 DDR3</button><button onclick="show('pcb')">修改 PCB Stackup</button></div><div id="out" class="card"></div><script>
const m={r:["BOM","AVL","基本功能"],osc:["BOM","Clock","Startup","Timing","EMC","Firmware assumption"],ldo:["BOM","Power","Loop stability","Thermal","PI","Layout"],ddr:["BOM","MIG/Timing","Pin/Package","PI","SI","Firmware","Validation"],pcb:["Fab","Impedance","Propagation","SI","DDR/High-speed","DFM","Validation"]};function show(k){out.className='card '+(m[k].length>4?'warn':'');out.innerHTML='<b>建议重开：</b><br>'+m[k].map(x=>'<span class="tag">'+x+'</span>').join('')+'<p>这是教学影响图，真实 ECO 仍需项目 impact analysis。</p>'}
show('osc');
</script></body></html>
