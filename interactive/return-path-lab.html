<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Path Lab</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:30px auto;padding:0 20px;color:#1f2937}.tabs button{padding:10px 14px;margin:4px;border:1px solid #94a3b8;background:#fff;border-radius:9px}.tabs button.active{background:#e0f2fe}.card{border:1px solid #cbd5e1;border-radius:14px;padding:18px;margin-top:16px}.plane{height:100px;background:#40566f;position:relative;margin:90px 50px 30px}.sig{height:9px;background:#d33;position:absolute;left:5%;right:5%;top:-55px;border-radius:7px}.ret{height:7px;background:#2674d9;position:absolute;left:12%;right:12%;top:30px;border-radius:7px}.slot{position:absolute;background:#fff;top:0;bottom:0;width:130px;left:44%;display:none}.via{position:absolute;width:14px;height:150px;background:#b7791f;top:-55px;left:50%;display:none}.rvia{position:absolute;width:14px;height:100px;background:#2674d9;top:0;left:56%;display:none}.detour{position:absolute;border:7px solid #2674d9;border-top:0;width:260px;height:55px;left:33%;top:28px;display:none;border-radius:0 0 35px 35px}.note{background:#f8fafc;padding:12px;border-radius:10px}.warn{background:#fff7ed;border-left:5px solid #f59e0b;padding:12px}</style><body><h1>Return Path Lab：参考面与换层直觉</h1><p>这是几何教学演示，不计算真实电流密度或 EM 场。</p><div class="tabs"><button onclick="mode('solid',this)" class="active">完整参考面</button><button onclick="mode('slot',this)">跨 Slot</button><button onclick="mode('near',this)">换层 + 近回流孔</button><button onclick="mode('far',this)">换层 + 远回流</button></div><div class="card"><div class="plane"><div class="sig"></div><div class="ret"></div><div class="slot"></div><div class="via"></div><div class="rvia"></div><div class="detour"></div></div><h2 id="title">完整参考面</h2><p id="desc">回流密度可集中在 signal 投影附近，局部回路紧凑，阻抗环境更可预测。</p></div><div class="warn">问自己：signal conductor 变层时，reference structure 是怎么连续过去的？如果解释不清，先不要布线。</div><script>function mode(m,b){document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let slot=document.querySelector('.slot'),via=document.querySelector('.via'),rv=document.querySelector('.rvia'),d=document.querySelector('.detour'),r=document.querySelector('.ret');slot.style.display=via.style.display=rv.style.display=d.style.display='none';r.style.display='block';let title='',desc='';if(m==='solid'){title='完整参考面';desc='回流密度可集中在 signal 投影附近，局部回路紧凑，阻抗环境更可预测。'}if(m==='slot'){slot.style.display='block';d.style.display='block';r.style.display='none';title='跨参考面 Slot';desc='回流不能穿过铜缺口，只能绕行或借助其他结构，回路面积和局部阻抗都会改变。'}if(m==='near'){via.style.display=rv.style.display='block';title='换层 + 附近 Return Via';desc='信号过孔和参考面的层间连接靠近，局部 return transition 更紧凑。'}if(m==='far'){via.style.display='block';d.style.display='block';r.style.display='none';title='换层 + 远距离回流';desc='回流必须绕到较远的层间连接，形成更大的局部回路。';}document.querySelector('#title').textContent=title;document.querySelector('#desc').textContent=desc}</script></body></html>
