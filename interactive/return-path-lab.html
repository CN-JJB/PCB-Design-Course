<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Current Lab</title>
<style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1120px;margin:28px auto;padding:0 20px;color:#0f172a;background:#f8fafc}h1{margin-bottom:6px}.lead{color:#475569}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{padding:10px 14px;border:1px solid #94a3b8;background:#fff;border-radius:10px;cursor:pointer}.tabs button.active{background:#dbeafe;border-color:#2563eb}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:16px;box-shadow:0 8px 26px rgba(15,23,42,.05)}label{display:block;font-weight:700;margin:12px 0 5px}input[type=range]{width:100%}.metric{font-size:27px;font-weight:800;margin:8px 0}.muted{color:#64748b;font-size:14px}.callout{background:#fff7ed;border-left:5px solid #f59e0b;padding:12px 14px;border-radius:8px;margin-top:16px}svg{width:100%;height:auto;background:#f8fafc;border-radius:12px}code{background:#e2e8f0;padding:2px 5px;border-radius:5px}</style></head><body>
<h1>Return Current Lab：把“回流路径”变成几何直觉</h1><p class="lead">定性可视化，不是 EM solver。观察 reference 距离、slot、共享回流、差分耦合与换层怎样改变 return structure。</p>
<div class="tabs"><button data-mode="single" class="active">单端 + 连续 Plane</button><button data-mode="slot">跨 Slot</button><button data-mode="shared">共享回流 / Ground Bounce</button><button data-mode="diff">差分对回流</button><button data-mode="via">换层 Return Transition</button></div>
<div class="grid"><div class="card"><label>Reference 距离 H：<span id="hval"></span></label><input id="h" type="range" min="45" max="180" value="75"><div id="netsBox"><label>同时切换网络数 N：<span id="nval"></span></label><input id="nets" type="range" min="1" max="4" value="3"></div><div id="viaBox"><label>Return via 距离：<span id="vval"></span></label><input id="vd" type="range" min="45" max="300" value="70"></div><div class="metric" id="metric"></div><div class="muted" id="metricDesc"></div><div class="callout" id="lesson"></div></div><div class="card"><svg id="viz" viewBox="0 0 800 520"></svg></div></div>
<script>
const svg=document.querySelector("#viz"),h=document.querySelector("#h"),nets=document.querySelector("#nets"),vd=document.querySelector("#vd");let mode="single";
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;render()});[h,nets,vd].forEach(x=>x.oninput=render);
function marker(id,c){return '<defs><marker id="'+id+'" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="'+c+'"/></marker></defs>'}
function plane(y,slot){return slot?'<rect x="40" y="'+y+'" width="310" height="28" fill="#475569"/><rect x="450" y="'+y+'" width="310" height="28" fill="#475569"/><text x="372" y="'+(y+20)+'" font-size="16" fill="#92400e">SLOT</text>':'<rect x="40" y="'+y+'" width="720" height="28" fill="#475569"/>'}
function band(cx,y,w){let s="";for(let i=0;i<6;i++){const ww=w*(1-i*.13),op=.10+i*.08;s+='<rect x="'+(cx-ww/2)+'" y="'+(y+i*7)+'" width="'+ww+'" height="7" rx="4" fill="#2563eb" opacity="'+op+'"/>'}return s}
function render(){const H=+h.value,N=+nets.value,V=+vd.value,sigY=90,planeY=Math.min(370,sigY+H+150);document.querySelector("#hval").textContent=(H/100).toFixed(2)+" × normalized";document.querySelector("#nval").textContent=N;document.querySelector("#vval").textContent=V+" px";document.querySelector("#netsBox").style.display=mode==="shared"?"block":"none";document.querySelector("#viaBox").style.display=mode==="via"?"block":"none";let s=marker("r","#c2410c")+marker("b","#2563eb"),lesson="",metric="",md="";
if(mode==="single"){const spread=90+H*1.4;s+='<text x="40" y="42" font-size="22" font-weight="700">单端线：H 越小，return density 越集中</text><rect x="90" y="'+sigY+'" width="620" height="18" rx="7" fill="#b45309"/>'+plane(planeY,false)+band(400,planeY+28,spread)+'<line x1="130" y1="66" x2="650" y2="66" stroke="#c2410c" stroke-width="6" marker-end="url(#r)"/><line x1="650" y1="'+(planeY+82)+'" x2="150" y2="'+(planeY+82)+'" stroke="#2563eb" stroke-width="6" marker-end="url(#b)"/>';for(let x=220;x<=580;x+=90)s+='<line x1="'+x+'" y1="112" x2="'+x+'" y2="'+(planeY-8)+'" stroke="#f59e0b" opacity=".45" stroke-width="2"/>';metric="Return spread："+Math.round(spread)+" px";md="只表示趋势，不是电流密度计算。";lesson="把 reference 拉近通常会同时改善 field confinement、return localization 和 crosstalk 风险。"}
if(mode==="slot"){s+='<text x="40" y="42" font-size="22" font-weight="700">跨 Slot：signal 连通，但 return structure 已断</text><rect x="90" y="'+sigY+'" width="620" height="18" rx="7" fill="#b45309"/>'+plane(planeY,true)+'<path d="M650 '+(planeY+70)+' C560 '+(planeY+70)+' 500 '+(planeY+125)+' 440 '+(planeY+125)+' C360 '+(planeY+125)+' 300 '+(planeY+70)+' 150 '+(planeY+70)+'" fill="none" stroke="#2563eb" stroke-width="7"/><text x="250" y="'+(planeY+160)+'" font-size="17" fill="#1d4ed8">return detour / current crowding</text>';metric="Lreturn ↑";md="更严格的图像还包括 slot/field mode。";lesson="跨槽的主要问题不是“地不够多”，而是 signal + reference 传输结构发生了突变。"}
if(mode==="shared"){s+='<text x="40" y="42" font-size="22" font-weight="700">共享高电感回流：simultaneous switching 会叠加</text>'+plane(390,true);for(let i=0;i<N;i++){let y=95+i*62;s+='<rect x="80" y="'+y+'" width="640" height="14" rx="6" fill="#b45309"/><path d="M690 '+(y+35)+' C610 '+(y+35)+' 560 450 435 455 C320 455 250 '+(y+35)+' 120 '+(y+35)+'" fill="none" stroke="#2563eb" stroke-width="5" opacity="'+(.45+i*.12)+'"/>'}s+='<rect x="325" y="430" width="230" height="55" rx="13" fill="#f59e0b" opacity=".32"/><text x="350" y="463" font-size="18" font-weight="700" fill="#92400e">shared Lreturn</text>';metric="Σ(di/dt)："+N+" 路贡献";md="若边沿同向同时发生，共享参考噪声可能叠加。";lesson="先修复 return path，再谈 spacing。共享回流串扰和普通 field crosstalk 是不同机制。"}
if(mode==="diff"){const spread=100+H*1.35;s+='<text x="40" y="42" font-size="22" font-weight="700">差分对：P↔N 与 pair↔plane 两种 coupling 同时存在</text><rect x="235" y="'+sigY+'" width="110" height="18" rx="7" fill="#dc2626"/><rect x="455" y="'+sigY+'" width="110" height="18" rx="7" fill="#2563eb"/>'+plane(planeY,false)+band(290,planeY+28,spread)+band(510,planeY+28,spread)+'<path d="M345 99 C390 170 410 170 455 99" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 7"/>';metric="Plane return spread："+Math.round(spread)+" px";md="Exact current split requires a field solver.";lesson="“差分对自己回流，所以不需要 plane”不是通用结论。H、gap、width 和结构共同决定回流分布。"}
if(mode==="via"){const p2=360,rvx=390+V;s+='<text x="40" y="42" font-size="22" font-weight="700">换层：signal via 与 return transition 要一起看</text><rect x="90" y="95" width="300" height="16" fill="#b45309"/><rect x="410" y="250" width="300" height="16" fill="#b45309"/><rect x="390" y="95" width="18" height="171" fill="#b7791f"/><rect x="50" y="165" width="700" height="22" fill="#475569"/><rect x="50" y="'+p2+'" width="700" height="22" fill="#475569"/><rect x="'+rvx+'" y="165" width="16" height="'+(p2-165)+'" fill="#2563eb"/><path d="M390 145 C'+(390+V/2)+' 130 '+rvx+' 190 '+rvx+' 220" fill="none" stroke="#2563eb" stroke-width="5"/>';metric="Return transition distance："+V+" px";md="距离越大，局部换层回路通常越大。";lesson="signal via 只是 conductor transition；reference structure 如何跟着换层同样重要。"}
svg.innerHTML=s;document.querySelector("#metric").textContent=metric;document.querySelector("#metricDesc").textContent=md;document.querySelector("#lesson").textContent=lesson}render();
</script></body></html>
