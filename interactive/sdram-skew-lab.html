<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDRAM Skew Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:#fff;border:1px solid #ccd9e8;border-radius:16px;padding:22px;margin:18px 0}.row{display:grid;grid-template-columns:210px 1fr 100px;gap:12px;align-items:center;margin:15px 0}.meter{height:28px;background:#e8edf4;border-radius:14px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#5a9b6b,#e6a13c,#c54b4b);width:0}.big{font-size:34px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box{background:#eef5ff;border-radius:12px;padding:16px}input{width:100%}small{color:#52677e}</style></head><body><h1>SDRAM Skew Lab｜长度差先换算成 ps</h1><p>教学模型：把“等长多少 mm”改写成 timing budget。传播延迟必须来自最终 stackup，而不是固定常数。</p><div class="card"><div class="row"><label>传播延迟 (ps/mm)</label><input id="p" type="range" min="4" max="9" value="6.5" step="0.1"><span id="pv"></span></div><div class="row"><label>组内长度差 (mm)</label><input id="m" type="range" min="0" max="40" value="15" step="0.5"><span id="mv"></span></div><div class="row"><label>项目 skew target (ps)</label><input id="t" type="range" min="40" max="300" value="100" step="10"><span id="tv"></span></div><div class="row"><label>可用 setup/hold budget (ps)</label><input id="b" type="range" min="100" max="1500" value="700" step="50"><span id="bv"></span></div></div><div class="grid"><div class="box"><div>Board skew</div><div class="big" id="sk"></div></div><div class="box"><div>Target 使用率</div><div class="big" id="use"></div></div><div class="box"><div>Timing budget 使用率</div><div class="big" id="bud"></div></div></div><div class="card"><div class="meter"><div class="bar" id="bar"></div></div><p id="msg"></p></div><small>100 ps 是本 V3 的初始 engineering target，不是 SDRAM 行业通用标准。真正 release 需要结合 MCU/SDRAM timing、clock path、SI 和实际 stackup。</small><script>["p","m","t","b"].forEach(function(x){document.getElementById(x).oninput=go});function go(){var p=+document.getElementById("p").value,m=+document.getElementById("m").value,t=+document.getElementById("t").value,b=+document.getElementById("b").value,s=p*m;pv.textContent=p;mv.textContent=m;tv.textContent=t;bv.textContent=b;sk.textContent=s.toFixed(1)+" ps";use.textContent=(100*s/t).toFixed(0)+"%";bud.textContent=(100*s/b).toFixed(0)+"%";bar.style.width=Math.min(100,100*s/t)+"%";msg.textContent=s<=t?"在当前项目 skew target 内；仍需 clock-to-group timing review。":"超出当前项目 target：先回看 placement/topology，再决定是否 tuning。"}go()</script></body></html>
