<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMC Timing Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f7fbff;color:#102a43}.card{background:white;border:1px solid #ccd8e6;border-radius:16px;padding:20px;margin:18px 0}.row{display:grid;grid-template-columns:180px 1fr 90px;gap:12px;align-items:center;margin:14px 0}input{width:100%}.big{font-size:30px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pill{padding:14px;border-radius:12px;background:#eef5ff}small{color:#53677f}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dde6ef;text-align:left}</style></head><body><h1>FMC Timing Lab｜ns → SDRAM cycles</h1><p>教学模型：帮助理解向上取整和时钟变化。不是 STM32 FMC 寄存器生成器；最终 encoding 必须核对 RM0433/HAL。</p><div class="card"><div class="row"><label>SDCLK (MHz)</label><input id="f" type="range" min="60" max="120" value="100"><span id="fv"></span></div><div class="row"><label>tRCD (ns)</label><input id="rcd" type="range" min="10" max="35" value="18"><span id="rcdv"></span></div><div class="row"><label>tRP (ns)</label><input id="rp" type="range" min="10" max="35" value="18"><span id="rpv"></span></div><div class="row"><label>tRAS (ns)</label><input id="ras" type="range" min="25" max="70" value="42"><span id="rasv"></span></div><div class="row"><label>tRC (ns)</label><input id="rc" type="range" min="40" max="100" value="60"><span id="rcv"></span></div></div><div class="grid"><div class="pill"><div>Tclk</div><div class="big" id="tclk"></div></div><div class="pill"><div>Refresh interval</div><div class="big">15.625 µs</div></div><div class="pill"><div>Approx cycles/refresh</div><div class="big" id="refresh"></div></div></div><div class="card"><table><thead><tr><th>Timing</th><th>Requirement</th><th>ceil(ns/Tclk)</th></tr></thead><tbody id="tb"></tbody></table></div><p><small>观察：频率升高时 Tclk 变短，同一个 ns requirement 需要更多 cycles；不能直接复制另一个工程的 timing 数字。</small></p><script>var ids=["f","rcd","rp","ras","rc"];ids.forEach(function(x){document.getElementById(x).oninput=calc});function c(v,t){return Math.ceil(v/t)}function calc(){var f=+document.getElementById("f").value,t=1000/f;document.getElementById("fv").textContent=f;["rcd","rp","ras","rc"].forEach(function(x){document.getElementById(x+"v").textContent=document.getElementById(x).value+" ns"});document.getElementById("tclk").textContent=t.toFixed(2)+" ns";document.getElementById("refresh").textContent=Math.round(15625/t);var rows=[["tRCD",+rcd.value],["tRP",+rp.value],["tRAS",+ras.value],["tRC",+rc.value]];document.getElementById("tb").innerHTML=rows.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[1]+" ns</td><td><b>"+c(r[1],t)+" cycles</b></td></tr>"}).join("")}calc()</script></body></html>
