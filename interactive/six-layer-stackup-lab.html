<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Six-Layer Stackup Lab</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f9fc;color:#16324a}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d7e1ea;border-radius:18px;padding:22px;margin:16px 0}.layers{display:grid;gap:8px}.layer{padding:14px;border-radius:10px;color:white;font-weight:700}.sig{background:#c97f26}.gnd{background:#374957}.pwr{background:#8d66b5}.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:18px}select,input{width:100%;padding:10px;margin-top:6px}.score{font-size:30px;font-weight:800}.good{color:#177245}.bad{color:#b42318}small{color:#637381}@media(max-width:700px){.ctrl{grid-template-columns:1fr}}</style><div class="wrap"><h1>Six-Layer Stackup Lab</h1><p>调整 L3/L4 的角色与相对 dielectric spacing，观察“层名相同但电磁邻接不同”的风险趋势。此页面只用于教学，不是 field solver。</p><div class="card ctrl"><label>L3 role<select id="l3"><option value="sig">Signal</option><option value="gnd">GND</option><option value="pwr">Power</option></select></label><label>L4 role<select id="l4"><option value="pwr">Power</option><option value="gnd">GND</option><option value="sig">Signal</option></select></label><label>L2-L3 spacing (mm)<input id="h23" type="range" min="0.08" max="0.7" step="0.01" value="0.55"><span id="v23"></span></label><label>L3-L4 spacing (mm)<input id="h34" type="range" min="0.08" max="0.7" step="0.01" value="0.21"><span id="v34"></span></label></div><div class="card"><div class="layers" id="layers"></div></div><div class="card"><div>Teaching risk score: <span class="score" id="score"></span></div><p id="msg"></p><small>评分只反映：相邻 signal-signal、signal 到 solid GND 的距离、power split 作为参考的潜在不确定性。真实设计必须结合 field solver、实际 stackup 和 net topology。</small></div></div><script>const q=x=>document.getElementById(x);function draw(){let l3=q('l3').value,l4=q('l4').value,h23=+q('h23').value,h34=+q('h34').value;q('v23').textContent=h23.toFixed(2);q('v34').textContent=h34.toFixed(2);let arr=[['L1','sig'],['L2','gnd'],['L3',l3],['L4',l4],['L5','gnd'],['L6','sig']];q('layers').innerHTML=arr.map(x=>`<div class="layer ${x[1]}">${x[0]} · ${x[1].toUpperCase()}</div>`).join('');let r=15;if(l3==='sig')r+=Math.max(0,(h23-.15)*60);if(l3==='sig'&&l4==='sig')r+=35;if(l3==='sig'&&l4==='pwr')r+=12;if(l4==='sig')r+=Math.max(0,(h34-.15)*45);if(l3==='gnd'||l4==='gnd')r-=10;r=Math.max(0,Math.min(100,Math.round(r)));q('score').textContent=r+'/100';q('score').className='score '+(r<40?'good':'bad');q('msg').textContent=r<40?'当前结构较容易形成清晰参考，但仍需检查真实 dielectric、split 与换层。':'当前结构有较强的 reference ambiguity / signal-signal coupling 教学风险，先重新检查邻接关系。'}['l3','l4','h23','h34'].forEach(x=>q(x).oninput=draw);draw();</script></html>
