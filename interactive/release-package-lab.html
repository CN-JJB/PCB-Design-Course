<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Package Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:#fff;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:12px;border-radius:10px;background:#eef5ff}.ok{border-left:6px solid #4d9965}.bad{border-left:6px solid #c94b4b}label{display:block;margin:8px 0}</style></head><body><h1>Release Package Lab</h1><p>选择要交付的内容，观察“只有 Gerber”为什么不是完整生产发布。</p><div class="card grid" id="items"></div><div id="out" class="card"></div><script>
const names=["Gerber/Drill","Fab Notes/Stackup","BOM/AVL","Placement/Assembly Drawing","Programming Image","Test Procedure/Limits","Release Manifest","Source Freeze/Hashes"];
items.innerHTML=names.map((n,i)=>'<label class="item"><input type="checkbox" data-i="'+i+'" '+(i===0?'checked':'')+'> '+n+'</label>').join('');
items.onchange=go; function go(){let c=[...document.querySelectorAll('input')].filter(x=>x.checked).length, ok=c===names.length; out.className='card '+(ok?'ok':'bad'); out.innerHTML=ok?'<b>完整性基本满足。</b><br>下一步仍要验证每份文件来自同一冻结 revision。':'<b>当前包仍可能无法复现产品。</b><br>缺失 '+(names.length-c)+' 类配置/制造/测试信息；工厂可能只能“猜”。';} go();
</script></body></html>
