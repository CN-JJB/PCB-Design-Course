<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference Transition Lab</title><style>body{font-family:system-ui,sans-serif;background:#f6f9fc;color:#17324d;margin:0}.w{max-width:980px;margin:auto;padding:28px}.c{background:white;border:1px solid #d6e0ea;border-radius:18px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}select,input{width:100%;padding:10px;margin-top:8px}.meter{height:18px;background:#e9eef3;border-radius:12px;overflow:hidden}.bar{height:100%;background:#2f79c5}.risk{font-size:28px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><div class="w"><h1>Reference Transition Lab</h1><p>比较 GND→GND 与 GND→PWR 换层时，local stitching / decoupling 距离对回流转移回路的趋势影响。不是 EM 仿真器。</p><div class="c grid"><label>New reference<select id="ref"><option value="gnd">GND plane</option><option value="pwr">Power plane</option></select></label><label>Support element<select id="sup"><option value="local">Local stitching / decoupling</option><option value="remote">Remote transfer path</option><option value="none">No explicit support</option></select></label><label>Estimated transfer distance (mm)<input id="d" type="range" min="0.5" max="40" step="0.5" value="2"><span id="dv"></span></label><label>Edge severity<input id="e" type="range" min="1" max="10" step="1" value="5"><span id="ev"></span></label></div><div class="c"><div class="risk" id="r"></div><div class="meter"><div class="bar" id="b"></div></div><p id="m"></p><p><b>思考：</b>如果新旧 reference 是不同 net，为什么一颗 GND stitching via 不能替代 GND↔PWR 的局部高频耦合路径？</p></div></div><script>const q=x=>document.getElementById(x);function f(){let ref=q('ref').value,s=q('sup').value,d=+q('d').value,e=+q('e').value;q('dv').textContent=d.toFixed(1)+' mm';q('ev').textContent=e;let x=d*1.5+e*3;if(s==='remote')x+=20;if(s==='none')x+=45;if(ref==='pwr')x+=12;if(ref==='pwr'&&s==='local')x-=8;x=Math.max(0,Math.min(100,Math.round(x)));q('r').textContent='Teaching risk: '+x+'/100';q('b').style.width=x+'%';q('m').textContent=x<35?'回流转移路径相对局部，结构较容易解释。':x<70?'需要检查 transfer loop、decoupling/stitching 与 reference continuity。':'回流可能被迫绕远，common-mode conversion 与 discontinuity 风险显著。'}['ref','sup','d','e'].forEach(x=>q(x).oninput=f);f();</script></html>
