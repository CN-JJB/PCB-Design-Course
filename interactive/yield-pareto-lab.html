<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yield Pareto Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:#fff;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.row{display:grid;grid-template-columns:190px 1fr 70px;gap:12px;align-items:center;margin:12px 0}.bar{height:22px;background:#e6edf5;border-radius:11px;overflow:hidden}.fill{height:100%;background:#7893b5}.big{font-size:30px;font-weight:800}input{width:100%}</style></head><body><h1>Yield Pareto Lab</h1><p>教学模型：调节几类 defect 数量，观察 First Pass Yield 和主要缺陷贡献。</p><div class="card"><div class="row"><label>投入数量</label><input id="qty" type="range" min="20" max="500" value="100"><span id="qtyv"></span></div><div class="row"><label>焊接缺陷</label><input id="a" type="range" min="0" max="80" value="12"><span id="av"></span></div><div class="row"><label>器件/极性</label><input id="b" type="range" min="0" max="80" value="6"><span id="bv"></span></div><div class="row"><label>烧录/测试</label><input id="c" type="range" min="0" max="80" value="4"><span id="cv"></span></div></div><div class="card"><div>FPY</div><div class="big" id="fpy"></div><div id="pareto"></div></div><script>
["qty","a","b","c"].forEach(x=>document.getElementById(x).oninput=go);function go(){let q=+qty.value,arr=[["焊接",+a.value],["器件/极性",+b.value],["烧录/测试",+c.value]],d=arr.reduce((s,x)=>s+x[1],0),pass=Math.max(0,q-d);qtyv.textContent=q;av.textContent=a.value;bv.textContent=b.value;cv.textContent=c.value;fpy.textContent=(100*pass/q).toFixed(1)+"%";let max=Math.max(1,...arr.map(x=>x[1]));pareto.innerHTML=arr.sort((x,y)=>y[1]-x[1]).map(x=>'<p>'+x[0]+'：'+x[1]+'</p><div class="bar"><div class="fill" style="width:'+(100*x[1]/max)+'%"></div></div>').join("");}go();
</script></body></html>
