<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethernet Boundary Lab</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:white;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{padding:16px;border:1px solid #bccce0;border-radius:12px;cursor:pointer}.choice:hover{background:#eef5ff}.chain{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.node{padding:18px;border-radius:12px;background:#eef5ff}.arrow{font-size:24px}.risk{padding:18px;border-radius:12px;background:#fff2f0;border-left:5px solid #c64b48}.ok{background:#eef9f1;border-left-color:#4c9964}button{font-size:15px}</style></head><body><h1>Ethernet Boundary Lab｜不要把 RMII、MDI、Cable 混成一类</h1><p>选择不同设计状态，观察主要风险。此页是教学性的结构模型，不是 EMC/ESD 仿真。</p><div class="card"><div class="chain"><div class="node">STM32 MAC</div><div class="arrow">→</div><div class="node">RMII</div><div class="arrow">→</div><div class="node">PHY</div><div class="arrow">→</div><div class="node">MDI</div><div class="arrow">→</div><div class="node">Magnetics</div><div class="arrow">→</div><div class="node">RJ45 / Cable</div></div></div><div class="choices"><button class="choice" onclick="show('rmii')">把 RMII 当 100 Ω 差分</button><button class="choice" onclick="show('mdi')">MDI 有长 test stub</button><button class="choice" onclick="show('shield')">Shield 无机壳策略直接短数字地</button><button class="choice" onclick="show('good')">分区清晰 + local PHY return + intentional boundary</button></div><div id="out" class="card risk"><b>选择一个场景。</b></div><script>function show(x){var m={rmii:"RMII 是 single-ended LVCMOS。错误的 differential 规则会掩盖真正的 reference、edge 和 source/load 问题。",mdi:"MDI 是模拟差分 channel。长 stub 会形成 discontinuity，优先删除或改变可测性方案。",shield:"Shield/chassis 处理依 enclosure、ESD 和 cable common-mode。直接把 shell 短到 System GND 不是通用答案。",good:"正确方向：RMII/MDI 分开约束；PHY→Magnetics→RJ45 紧凑；shield/chassis 有明确 return/discharge structure；SDRAM tuning zone 与 connector boundary 分离。"};out.className="card risk"+(x==="good"?" ok":"");out.innerHTML="<b>分析：</b> "+m[x]}</script></body></html>
