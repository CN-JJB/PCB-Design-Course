<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGA Escape Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f8fbff;color:#102a43}.card{background:white;border:1px solid #ccd8e5;border-radius:16px;padding:20px;margin:18px 0}.row{display:grid;grid-template-columns:210px 1fr 90px;gap:12px;align-items:center;margin:14px 0}input{width:100%}.big{font-size:32px;font-weight:800}.ok{border-left:6px solid #4d9965}.bad{border-left:6px solid #c94b4b}small{color:#52677f}</style></head><body><h1>BGA Escape Lab｜几何通道够不够？</h1><p>简化几何模型：估算两个相邻 via pad 之间是否能容纳一根 trace + 两侧 spacing。最终必须以板厂 DFM/footprint 为准。</p><div class="card"><div class="row"><label>Ball pitch (mm)</label><input id="p" type="range" min=".5" max="1.0" value=".8" step=".05"><span id="pv"></span></div><div class="row"><label>Via pad diameter (mm)</label><input id="v" type="range" min=".3" max=".7" value=".45" step=".01"><span id="vv"></span></div><div class="row"><label>Trace width (mm)</label><input id="w" type="range" min=".075" max=".2" value=".1" step=".005"><span id="wv"></span></div><div class="row"><label>Clearance each side (mm)</label><input id="s" type="range" min=".075" max=".2" value=".1" step=".005"><span id="sv"></span></div></div><div id="out" class="card"><div>Via-to-via channel</div><div class="big" id="ch"></div><div>Required trace corridor</div><div class="big" id="rq"></div><p id="msg"></p></div><small>此模型没有包含 solder mask、drill tolerance、annular ring、etch compensation、escape angle 等制造因素。</small><script>["p","v","w","s"].forEach(x=>document.getElementById(x).oninput=go);function go(){let p=+document.getElementById("p").value,v=+document.getElementById("v").value,w=+document.getElementById("w").value,s=+document.getElementById("s").value,c=p-v,r=w+2*s;pv.textContent=p.toFixed(2);vv.textContent=v.toFixed(2);wv.textContent=w.toFixed(3);sv.textContent=s.toFixed(3);ch.textContent=c.toFixed(3)+" mm";rq.textContent=r.toFixed(3)+" mm";let ok=c>=r;out.className="card "+(ok?"ok":"bad");msg.textContent=ok?"简化模型下可过 1 根线；仍需板厂 DFM 验证。":"简化模型下通道不足。不要先偷缩全板规则，应改 via/pad/fanout/层数或制造工艺。"}go()</script></body></html>
