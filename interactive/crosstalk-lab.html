<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crosstalk Lab</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:30px auto;padding:0 20px;color:#1f2937}.card{border:1px solid #cbd5e1;border-radius:14px;padding:18px;margin:16px 0}.row{display:grid;grid-template-columns:220px 1fr 110px;gap:12px;align-items:center;margin:12px 0}.big{font-size:34px;font-weight:700}.bar{height:24px;background:#e2e8f0;border-radius:12px;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transition:width .2s}.note{background:#fff7ed;border-left:5px solid #f59e0b;padding:12px}</style><body><h1>Crosstalk Lab：几何趋势实验</h1><p>调整 S、H、平行长度和边沿时间。输出是<strong>教学风险指数</strong>，不是 NEXT/FEXT 的真实 dB 结果。</p><div class="card"><div class="row"><label>Spacing S (mm)</label><input id="s" type="range" min="0.1" max="2" step="0.05" value="0.4"><span id="sv"></span></div><div class="row"><label>Reference height H (mm)</label><input id="h" type="range" min="0.05" max="0.5" step="0.01" value="0.1"><span id="hv"></span></div><div class="row"><label>Parallel length (mm)</label><input id="l" type="range" min="1" max="120" step="1" value="30"><span id="lv"></span></div><div class="row"><label>Rise time tr (ns)</label><input id="tr" type="range" min="0.2" max="20" step="0.1" value="2"><span id="trv"></span></div></div><div class="card"><div>教学风险指数</div><div id="score" class="big"></div><div class="bar"><div id="fill" class="fill"></div></div><p id="msg"></p></div><div class="note">趋势模型：风险随平行长度增加、参考面变远、边沿变快而上升；随 spacing 增大而下降。真实串扰必须用耦合传输线/场求解/测量分析。</div><script>const ids=['s','h','l','tr'];ids.forEach(id=>document.querySelector('#'+id).oninput=update);function update(){let s=+document.querySelector('#s').value,h=+document.querySelector('#h').value,l=+document.querySelector('#l').value,tr=+document.querySelector('#tr').value;document.querySelector('#sv').textContent=s.toFixed(2)+' mm';document.querySelector('#hv').textContent=h.toFixed(2)+' mm';document.querySelector('#lv').textContent=l+' mm';document.querySelector('#trv').textContent=tr.toFixed(1)+' ns';let geom=h/(s+h),len=Math.min(1,l/80),edge=Math.min(1,2/tr);let risk=Math.max(0,Math.min(100,100*geom*len*(0.35+0.65*edge)*2.2));document.querySelector('#score').textContent=risk.toFixed(0)+'/100';document.querySelector('#fill').style.width=risk+'%';document.querySelector('#msg').textContent=risk<25?'低趋势：几何较宽松。':risk<60?'中等趋势：检查 aggressor/victim、parallel run 和接口要求。':'高趋势：优先拉开、缩短并行段或让信号更靠近 reference plane。'}update()</script></body></html>
