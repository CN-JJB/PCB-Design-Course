<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690">
<rect width="1180" height="690" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Three changes, three different physical problems</text>

<rect x="55" y="88" width="1070" height="105" rx="18" fill="#fff" stroke="#cbd5e1"/>
<text x="80" y="125" font-family="sans-serif" font-size="21" font-weight="700" fill="#991b1b">Original network</text>
<text x="80" y="158" font-family="sans-serif" font-size="17" fill="#334155">Fast edge + unequal T branches + no source damping + large H + long parallel victim</text>
<path d="M680 142 H1000" stroke="#dc2626" stroke-width="8"/>
<path d="M800 142 V112 H1010" stroke="#dc2626" stroke-width="8"/>
<path d="M800 142 V172 H960" stroke="#dc2626" stroke-width="8"/>
<text x="780" y="102" font-family="sans-serif" font-size="14" fill="#991b1b">long branch</text>
<text x="780" y="194" font-family="sans-serif" font-size="14" fill="#991b1b">short branch</text>

<rect x="55" y="225" width="330" height="325" rx="18" fill="#fff" stroke="#cbd5e1"/>
<text x="80" y="265" font-family="sans-serif" font-size="21" font-weight="700" fill="#166534">1. Topology symmetry</text>
<path d="M95 325 H205" stroke="#7c3aed" stroke-width="7"/>
<path d="M205 325 V285 H335" stroke="#7c3aed" stroke-width="7"/>
<path d="M205 325 V365 H335" stroke="#7c3aed" stroke-width="7"/>
<text x="95" y="410" font-family="sans-serif" font-size="16" fill="#334155">Goal in this case:</text>
<text x="95" y="440" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">regularize reflection timing</text>
<text x="95" y="472" font-family="sans-serif" font-size="15" fill="#64748b">Not a universal “all branches</text>
<text x="95" y="495" font-family="sans-serif" font-size="15" fill="#64748b">must be equal length” rule.</text>

<rect x="425" y="225" width="330" height="325" rx="18" fill="#fff" stroke="#cbd5e1"/>
<text x="450" y="265" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">2. Source series R</text>
<rect x="465" y="318" width="70" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="478" y="341" font-family="sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Rs</text>
<line x1="535" y1="335" x2="700" y2="335" stroke="#2563eb" stroke-width="7"/>
<text x="455" y="410" font-family="sans-serif" font-size="16" fill="#334155">Target:</text>
<text x="455" y="440" font-family="sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Rout + Rs ≈ Z0</text>
<text x="455" y="472" font-family="sans-serif" font-size="15" fill="#64748b">Damps repeated bounce.</text>
<text x="455" y="495" font-family="sans-serif" font-size="15" fill="#64748b">33 Ω is case-specific.</text>

<rect x="795" y="225" width="330" height="325" rx="18" fill="#fff" stroke="#cbd5e1"/>
<text x="820" y="265" font-family="sans-serif" font-size="21" font-weight="700" fill="#92400e">3. Smaller H / known Z0</text>
<line x1="835" y1="320" x2="1080" y2="320" stroke="#dc2626" stroke-width="8"/>
<line x1="835" y1="385" x2="1080" y2="385" stroke="#475569" stroke-width="12"/>
<line x1="950" y1="327" x2="950" y2="378" stroke="#f59e0b" stroke-width="4"/>
<text x="965" y="357" font-family="sans-serif" font-size="17" fill="#92400e">H ↓</text>
<text x="820" y="430" font-family="sans-serif" font-size="17" fill="#334155">More confined fields</text>
<text x="820" y="458" font-family="sans-serif" font-size="17" fill="#334155">More local return current</text>
<text x="820" y="486" font-family="sans-serif" font-size="17" fill="#334155">Lower crosstalk tendency</text>

<rect x="55" y="590" width="1070" height="60" rx="14" fill="#e2e8f0"/>
<text x="78" y="615" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Topology decides how waves split; termination decides how reflections stop; stackup decides the electromagnetic environment.</text>
<text x="78" y="640" font-family="sans-serif" font-size="15" fill="#475569">The three changes are complementary, not interchangeable.</text>
</svg>