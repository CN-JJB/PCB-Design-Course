<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:29px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:16px}.m{fill:#fff;stroke:#526f97;stroke-width:2}.q{fill:#f4efff;stroke:#7656c5;stroke-width:2}.clk{stroke:#d83a3a;stroke-width:6;fill:none}.data{stroke:#2368bd;stroke-width:4;fill:none}.addr{stroke:#7f58bf;stroke-width:4;fill:none}.g{stroke:#3c8b5a;stroke-width:4;fill:none}</style><rect width="1150" height="560" fill="#f8fbff"/><text x="45" y="48" class="t h">SDRAM Routing Topology｜先拓扑，后等长</text>
<rect x="70" y="110" width="260" height="315" rx="18" class="m"/><text x="200" y="150" text-anchor="middle" class="t h">STM32H743</text><text x="200" y="185" text-anchor="middle" class="t s">FMC x16 · AF12</text>
<rect x="810" y="110" width="270" height="315" rx="18" class="q"/><text x="945" y="150" text-anchor="middle" class="t h">SDRAM</text><text x="945" y="185" text-anchor="middle" class="t s">4M×16 · 4 banks · TSOP II</text>
<path d="M330 220 C500 205 630 205 810 220" class="clk"/><text x="570" y="195" class="t b">SDCLK</text>
<path d="M330 275 C480 250 660 300 810 275" class="data"/><path d="M330 300 C490 280 640 325 810 300" class="data"/><text x="545" y="340" class="t b">DQ[15:0] + DQM（双向）</text>
<path d="M330 365 C480 350 660 350 810 365" class="addr"/><text x="500" y="395" class="t b">A[11:0] / BA / Command</text>
<line x1="80" y1="470" x2="1070" y2="470" stroke="#3a4654" stroke-width="18"/><text x="575" y="510" text-anchor="middle" class="t s">Solid reference plane：同一总线尽量保持一致 reference，换层必须解释 return transition</text>
<text x="45" y="545" class="t s">规则：SDCLK 先直、DQ 自然走、Address/Control 成束；只有 timing budget 需要时才补蛇形。</text></svg>