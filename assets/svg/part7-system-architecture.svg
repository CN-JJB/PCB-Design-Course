<rect x="80" y="120" width="250" height="135" rx="16" class="p"/><text x="205" y="160" text-anchor="middle" class="t b">8 MiB SDRAM</text><text x="205" y="193" text-anchor="middle" class="t s">AS4C4M16SA · x16</text><text x="205" y="220" text-anchor="middle" class="t s">SDCLK 100 MHz</text>
