<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:15px}.board{fill:#f3f8f1;stroke:#4f7c54;stroke-width:4}.m{fill:#edf4ff;stroke:#527cb5;stroke-width:2}.mem{fill:#f5efff;stroke:#795dc0;stroke-width:2}.eth{fill:#eef9f1;stroke:#4c9a65;stroke-width:2}.ext{fill:#fff4e6;stroke:#d18b25;stroke-width:2}.pow{fill:#fff0f0;stroke:#cc4e4e;stroke-width:2}</style><rect width="1180" height="650" fill="#f8fbff"/><text x="45" y="45" class="t h">V3 Six-Layer Floorplan｜空间决定后面的 SI / PI / EMC</text>
<rect x="80" y="90" width="1020" height="480" rx="28" class="board"/>
<rect x="420" y="210" width="260" height="180" rx="18" class="m"/><text x="550" y="280" text-anchor="middle" class="t h">STM32H743</text><text x="550" y="320" text-anchor="middle" class="t s">MCU core zone</text>
<rect x="155" y="205" width="210" height="190" rx="18" class="mem"/><text x="260" y="275" text-anchor="middle" class="t b">SDRAM</text><text x="260" y="310" text-anchor="middle" class="t s">DQ / A/C / SDCLK corridor</text><text x="260" y="340" text-anchor="middle" class="t s">tuning space</text>
<rect x="760" y="220" width="175" height="150" rx="18" class="eth"/><text x="848" y="275" text-anchor="middle" class="t b">PHY</text><text x="848" y="310" text-anchor="middle" class="t s">RMII ↔ MDI</text>
<rect x="955" y="190" width="110" height="210" rx="18" class="ext"/><text x="1010" y="260" text-anchor="middle" class="t b">Mag</text><text x="1010" y="292" text-anchor="middle" class="t b">RJ45</text><text x="1010" y="330" text-anchor="middle" class="t s">ESD</text>
<rect x="650" y="445" width="245" height="85" rx="16" class="pow"/><text x="772" y="480" text-anchor="middle" class="t b">Power Switching Zone</text><text x="772" y="508" text-anchor="middle" class="t s">keep SW away from CLK / MDI</text>
<line x1="365" y1="295" x2="420" y2="295" stroke="#7a5fc0" stroke-width="18"/><line x1="680" y1="295" x2="760" y2="295" stroke="#4d8c62" stroke-width="13"/><line x1="935" y1="295" x2="955" y2="295" stroke="#d18b25" stroke-width="15"/>
<text x="80" y="615" class="t s">优先 adjacency：MCU↔SDRAM；PHY↔Magnetics↔RJ45。Power zone 不能切进 SDRAM timing corridor 或 PHY analog boundary。</text></svg>