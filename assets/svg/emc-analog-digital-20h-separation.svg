<rect x="120" y="575" width="940" height="72" rx="14" fill="#fff"/>
<text x="145" y="605" font-size="18" font-weight="700" fill="#0f172a">20H in this chapter = conservative region-separation heuristic</text>
<text x="145" y="632" font-size="16" fill="#475569">It is not a universal clearance rule and is not the same as the old “power plane edge pullback 20H” rule.</text>
