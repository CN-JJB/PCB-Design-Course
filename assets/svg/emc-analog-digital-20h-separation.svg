<rect x="850" y="210" width="180" height="145" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
<text x="895" y="250" font-size="20" font-weight="700" fill="#1d4ed8">Digital</text>
<line x1="240" y1="355" x2="240" y2="470" stroke="#16a34a" stroke-width="5"/>
<line x1="940" y1="355" x2="940" y2="470" stroke="#2563eb" stroke-width="5"/>
<line x1="260" y1="420" x2="920" y2="420" stroke="#64748b" stroke-width="3"/>
<text x="540" y="405" font-size="19" font-weight="700" fill="#334155">separation</text>
<line x1="340" y1="450" x2="340" y2="470" stroke="#f59e0b" stroke-width="4"/>
