<text x="352" y="415" font-size="20" font-weight="700" fill="#92400e">H</text>

<path d="M240 355 C330 320 380 320 445 355" fill="none" stroke="#16a34a" stroke-width="4" opacity=".75"/>
<path d="M940 355 C850 320 800 320 735 355" fill="none" stroke="#2563eb" stroke-width="4" opacity=".75"/>
