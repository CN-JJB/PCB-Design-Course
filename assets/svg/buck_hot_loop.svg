<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="hr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#d33"/></marker>
  </defs>
  <rect width="960" height="540" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Buck 的热回路：EMI 与振铃的总源头</text>

  <!-- GOOD layout -->
  <g transform="translate(70,64)">
    <text x="200" y="-10" text-anchor="middle" font-size="16.5" fill="#2e7d32" font-weight="bold">✓ Cin 紧贴功率脚：热回路面积最小</text>
    <!-- board -->
    <rect x="0" y="0" width="400" height="230" rx="8" fill="#efe6cf" stroke="#b3a67f"/>
    <!-- IC -->
    <rect x="150" y="80" width="110" height="80" rx="6" fill="#37474f"/>
    <text x="205" y="126" text-anchor="middle" font-size="14" fill="#fff">Buck IC</text>
    <!-- Cin close -->
    <rect x="58" y="92" width="44" height="56" rx="4" fill="#5c6bc0"/>
    <text x="80" y="86" text-anchor="middle" font-size="13" fill="#3949ab">Cin</text>
    <!-- L -->
    <circle cx="330" cy="120" r="34" fill="none" stroke="#6d4c41" stroke-width="9"/>
    <text x="330" y="176" text-anchor="middle" font-size="13" fill="#6d4c41">L</text>
    <!-- hot loop highlight: Vin node -> HS -> LS -> gnd return -->
    <ellipse cx="165" cy="120" rx="105" ry="62" fill="none" stroke="#d33" stroke-width="4" stroke-dasharray="10,6"/>
    <text x="165" y="212" text-anchor="middle" font-size="14.5" fill="#d33" font-weight="bold">热回路：Cin→HS→LS→GND，di/dt 最大</text>
    <text x="205" y="46" text-anchor="middle" font-size="13.5" fill="#555">SW 节点铜皮保持最小必要面积(散热 vs 天线的平衡)</text>
  </g>

  <!-- BAD layout -->
  <g transform="translate(550,64)">
    <text x="180" y="-10" text-anchor="middle" font-size="16.5" fill="#d33" font-weight="bold">✗ Cin 远置：大环路 = 环形天线 + 振铃放大器</text>
    <rect x="0" y="0" width="400" height="230" rx="8" fill="#efe6cf" stroke="#b3a67f"/>
    <rect x="20" y="24" width="44" height="56" rx="4" fill="#90a4ae"/>
    <text x="42" y="18" text-anchor="middle" font-size="13" fill="#455a64">Cin 太远</text>
    <rect x="150" y="80" width="110" height="80" rx="6" fill="#37474f"/>
    <text x="205" y="126" text-anchor="middle" font-size="14" fill="#fff">Buck IC</text>
    <circle cx="340" cy="120" r="34" fill="none" stroke="#6d4c41" stroke-width="9"/>
    <ellipse cx="185" cy="95" rx="165" ry="82" fill="none" stroke="#d33" stroke-width="4" stroke-dasharray="10,6"/>
    <text x="185" y="212" text-anchor="middle" font-size="14.5" fill="#d33" font-weight="bold">每 nH × 1A/ns ≈ 1V 尖峰 → SW 振铃 + EMI</text>
  </g>

  <!-- rules strip -->
  <g transform="translate(60,360)" font-size="14.5">
    <text x="0" y="0" fill="#222" font-weight="bold">十二条铁律精简版：① Cin 贴脸 ② Cboot&lt;2mm ③ FB 远离 SW 且采样点在 Cout 后 ④ 电感下方信号净空</text>
    <text x="0" y="28" fill="#555">⑤ 功率地/信号地合理汇接 ⑥ 预留 SW-GND snubber RC 焊位（EMI 整改后悔药）……完整十二条见专题二</text>
    <text x="0" y="60" fill="#2e7d32" font-weight="bold">整改优先级：挪 Cin(免费) → 加 snubber(-4dB, 效率-0.3%) → 屏蔽电感/输入磁珠</text>
  </g>
  <text x="480" y="512" text-anchor="middle" font-size="13" fill="#999">配套：《07_进阶专题/02_开关电源PCB设计》＋ 案例5/案例B 整改实录</text>
</svg>
