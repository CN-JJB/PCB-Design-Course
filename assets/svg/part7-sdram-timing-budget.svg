<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:16px}.card{fill:#fff;stroke:#8da4c4;stroke-width:2}.red{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.green{fill:#eff9f2;stroke:#4d9c68;stroke-width:2}.purple{fill:#f5efff;stroke:#7b62bf;stroke-width:2}</style><rect width="1180" height="600" fill="#f8fbff"/><text x="45" y="48" class="t h">FMC Timing Budget｜ns → cycles → board delay → margin</text>
<rect x="55" y="100" width="230" height="160" rx="14" class="purple"/><text x="170" y="138" text-anchor="middle" class="t b">SDRAM Datasheet</text><text x="170" y="177" text-anchor="middle" class="t s">tRCD 18 ns</text><text x="170" y="205" text-anchor="middle" class="t s">tRP 18 ns</text><text x="170" y="233" text-anchor="middle" class="t s">tRAS 42 ns · tRC 60 ns</text>
<rect x="345" y="100" width="210" height="160" rx="14" class="card"/><text x="450" y="138" text-anchor="middle" class="t b">Project Clock</text><text x="450" y="183" text-anchor="middle" class="t h">100 MHz</text><text x="450" y="222" text-anchor="middle" class="t s">Tclk = 10 ns</text>
<rect x="615" y="100" width="230" height="160" rx="14" class="green"/><text x="730" y="138" text-anchor="middle" class="t b">ceil(ns / Tclk)</text><text x="730" y="175" text-anchor="middle" class="t s">TRCD = 2 cycles</text><text x="730" y="203" text-anchor="middle" class="t s">TRAS = 5 cycles</text><text x="730" y="231" text-anchor="middle" class="t s">TRC = 6 cycles</text>
<rect x="905" y="100" width="220" height="160" rx="14" class="red"/><text x="1015" y="138" text-anchor="middle" class="t b">Register/HAL</text><text x="1015" y="178" text-anchor="middle" class="t s">physical cycles ≠</text><text x="1015" y="205" text-anchor="middle" class="t s">field encoding ≠</text><text x="1015" y="232" text-anchor="middle" class="t s">copied internet value</text>
<text x="310" y="185" class="t h">→</text><text x="575" y="185" class="t h">→</text><text x="865" y="185" class="t h">→</text>
<rect x="100" y="345" width="980" height="150" rx="18" class="card"/><text x="590" y="385" text-anchor="middle" class="t b">真正 Timing Closure</text><text x="590" y="425" text-anchor="middle" class="t h">MCU launch + PCB skew + SDRAM setup/hold + Clock relation = Margin</text><text x="590" y="465" text-anchor="middle" class="t s">长度只是 delay 的一种表达；stackup 改变后必须重新换算 ps/mm。</text>
<text x="45" y="555" class="t b">禁止：向下取整、抄 RefreshCount、只看 SDRAM speed grade、不核 MCU silicon revision。</text></svg>