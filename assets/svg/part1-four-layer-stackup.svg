<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.cu{fill:#d88b2f}.gnd{fill:#334155}.pwr{fill:#b45309}.fr{fill:#f2e5c4}.call{fill:#f8fafc;stroke:#cbd5e1}.good{fill:#ecfdf5;stroke:#86efac}</style><rect width="1200" height="620" fill="white"/><text x="600" y="44" text-anchor="middle" class="title">STM32F407 V1｜四层物理叠层与参考关系</text><text x="600" y="72" text-anchor="middle" class="s">教学案例：JLC04161H-3313（公开数据查询 2026-08-26；下单前重新核对厂商页面）</text><g transform="translate(90,115)"><rect x="0" y="0" width="650" height="40" class="cu"/><text x="20" y="27" class="h">L1 — Signal + Components</text><rect x="0" y="40" width="650" height="58" class="fr"/><text x="20" y="76" class="t">3313 prepreg ≈ 0.0994 mm</text><rect x="0" y="98" width="650" height="30" class="gnd"/><text x="20" y="120" class="t" fill="white">L2 — Solid GND reference</text><rect x="0" y="128" width="650" height="245" class="fr"/><text x="20" y="255" class="t">Core ≈ 1.265 mm</text><rect x="0" y="373" width="650" height="30" class="pwr"/><text x="20" y="395" class="t" fill="white">L3 — Power distribution</text><rect x="0" y="403" width="650" height="58" class="fr"/><text x="20" y="439" class="t">3313 prepreg ≈ 0.0994 mm</text><rect x="0" y="461" width="650" height="40" class="cu"/><text x="20" y="488" class="h">L4 — Secondary Signal + Components</text></g><rect x="790" y="125" width="340" height="145" rx="14" class="good"/><text x="815" y="158" class="h">为什么 L1 是主高速层？</text><text x="815" y="192" class="t">• 紧邻连续 L2 GND</text><text x="815" y="222" class="t">• 参考关系稳定</text><text x="815" y="252" class="t">• 回流与场更容易受控</text><rect x="790" y="295" width="340" height="190" rx="14" class="call"/><text x="815" y="330" class="h">为什么 L4 要更谨慎？</text><text x="815" y="365" class="t">L4 紧邻的是 L3 Power。</text><text x="815" y="396" class="t">如果 L3 被多电源分割，</text><text x="815" y="427" class="t">Bottom 关键网络的参考结构</text><text x="815" y="458" class="t">可能随路径变化。</text><text x="600" y="584" text-anchor="middle" class="s">示意按 nominal thickness 比例强化显示；不是制造剖面测量图。实际阻抗请使用板厂当前 stackup 与阻抗计算体系。</text></svg>