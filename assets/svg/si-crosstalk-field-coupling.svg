<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<defs>
  <marker id="aR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="aB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>
<rect width="1180" height="620" rx="22" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f172a">Crosstalk 的根：fringe electric field + fringe magnetic field</text>

<text x="70" y="98" font-family="sans-serif" font-size="20" font-weight="700" fill="#991b1b">A. Electric-field coupling → mutual capacitance</text>
<rect x="100" y="145" width="285" height="20" rx="7" fill="#dc2626"/>
<rect x="500" y="145" width="285" height="20" rx="7" fill="#2563eb"/>
<text x="188" y="137" font-family="sans-serif" font-size="18" fill="#991b1b">Aggressor</text>
<text x="595" y="137" font-family="sans-serif" font-size="18" fill="#1d4ed8">Victim</text>
<path d="M330 165 C405 205 470 205 545 165" fill="none" stroke="#f59e0b" stroke-width="4"/>
<path d="M300 165 C405 250 495 250 600 165" fill="none" stroke="#f59e0b" stroke-width="3" opacity=".7"/>
<path d="M270 165 C405 290 525 290 660 165" fill="none" stroke="#f59e0b" stroke-width="2" opacity=".45"/>
<text x="325" y="245" font-family="sans-serif" font-size="17" fill="#92400e">fringe E-field</text>
<text x="108" y="300" font-family="sans-serif" font-size="18" fill="#334155">Only when voltage changes:</text>
<text x="108" y="330" font-family="sans-serif" font-size="21" font-weight="700" fill="#9a3412">i₍cpl₎ ∝ Cₘ · dV/dt</text>
<text x="108" y="360" font-family="sans-serif" font-size="16" fill="#64748b">Changing E-field ↔ displacement current</text>

<text x="70" y="420" font-family="sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">B. Magnetic-field coupling → mutual inductance</text>
<rect x="100" y="470" width="285" height="20" rx="7" fill="#dc2626"/>
<rect x="500" y="470" width="285" height="20" rx="7" fill="#2563eb"/>
<path d="M125 460 C170 410 310 410 355 460" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path d="M185 450 C270 380 520 380 610 450" fill="none" stroke="#7c3aed" stroke-width="3" opacity=".7"/>
<path d="M245 445 C390 345 675 345 750 455" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".45"/>
<text x="323" y="405" font-family="sans-serif" font-size="17" fill="#6d28d9">fringe H-field / linked flux</text>
<text x="820" y="470" font-family="sans-serif" font-size="18" fill="#334155">Only when current changes:</text>
<text x="820" y="502" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">v₍ind₎ ∝ M · dI/dt</text>
<text x="820" y="535" font-family="sans-serif" font-size="16" fill="#64748b">Lenz's law sets induced polarity</text>

<rect x="815" y="135" width="285" height="200" rx="18" fill="#e2e8f0"/>
<text x="840" y="175" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a">Layout knobs</text>
<text x="840" y="210" font-family="sans-serif" font-size="17" fill="#334155">• increase aggressor-victim spacing</text>
<text x="840" y="242" font-family="sans-serif" font-size="17" fill="#334155">• shorten coupled length</text>
<text x="840" y="274" font-family="sans-serif" font-size="17" fill="#334155">• bring reference closer</text>
<text x="840" y="306" font-family="sans-serif" font-size="17" fill="#334155">• use no-faster-than-needed edge</text>

<rect x="70" y="570" width="1030" height="34" rx="9" fill="#fff7ed"/>
<text x="92" y="593" font-family="sans-serif" font-size="16" fill="#92400e">Circuit Cₘ / M models are approximations; the physical coupling is the changing electromagnetic field.</text>
</svg>