<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Four-layer stackup candidate scorecard</title>
<desc id="desc">Comparison of 7628 and 3313 outer dielectric spacing and the engineering chain from reference height to field confinement, impedance geometry and routing density.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<style>
.t{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
.h{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111827}
.s{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4b5563}
.x{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#374151}
.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}
.a{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
.b{fill:#dcfce7;stroke:#4ade80;stroke-width:2}
.c{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}
.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arr)}
.sig{fill:#b45309}
.plane{fill:#6b7280}
.field{fill:none;stroke:#9ca3af;stroke-width:2}
</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<text x="55" y="52" class="t">4-Layer Stackup：不是看名字，而是比较 H → Field → Geometry → Density</text>
<text x="55" y="82" class="s">JLCPCB 1.6 mm 四层 current case：3313 与 7628 只作为教学对比；下单前重新查板厂</text>

<rect x="55" y="125" width="480" height="300" rx="16" class="a"/>
<text x="295" y="158" text-anchor="middle" class="h">JLC7628 teaching candidate</text>
<rect x="115" y="205" width="360" height="12" class="sig"/>
<text x="95" y="216" class="x">L1</text>
<path d="M185 218 C180 250 165 270 145 300" class="field"/>
<path d="M245 218 C240 255 225 278 205 310" class="field"/>
<path d="M305 218 C310 255 330 278 350 310" class="field"/>
<path d="M365 218 C372 250 392 270 415 300" class="field"/>
<line x1="115" y1="335" x2="475" y2="335" stroke="#6b7280" stroke-width="18"/>
<text x="95" y="341" class="x">L2</text>
<line x1="490" y1="217" x2="490" y2="335" stroke="#374151" stroke-width="2"/>
<text x="500" y="280" class="x">H ≈ 0.2104 mm</text>
<text x="295" y="385" text-anchor="middle" class="s">reference farther → wider field footprint</text>
<text x="295" y="408" text-anchor="middle" class="s">same target Z0 often needs wider trace</text>

<rect x="665" y="125" width="480" height="300" rx="16" class="b"/>
<text x="905" y="158" text-anchor="middle" class="h">JLC3313 teaching candidate</text>
<rect x="725" y="220" width="360" height="12" class="sig"/>
<text x="705" y="231" class="x">L1</text>
<path d="M795 232 C790 250 780 268 770 285" class="field"/>
<path d="M855 232 C850 252 842 270 835 287" class="field"/>
<path d="M915 232 C920 252 930 270 940 287" class="field"/>
<path d="M975 232 C980 250 990 268 1000 285" class="field"/>
<line x1="725" y1="300" x2="1085" y2="300" stroke="#6b7280" stroke-width="18"/>
<text x="705" y="306" class="x">L2</text>
<line x1="1100" y1="232" x2="1100" y2="300" stroke="#374151" stroke-width="2"/>
<text x="1110" y="272" class="x">H ≈ 0.0994 mm</text>
<text x="905" y="385" text-anchor="middle" class="s">reference closer → field more confined</text>
<text x="905" y="408" text-anchor="middle" class="s">same target Z0 can permit narrower geometry</text>

<rect x="80" y="500" width="190" height="86" rx="12" class="c"/>
<text x="175" y="532" text-anchor="middle" class="h">Reference H</text>
<text x="175" y="560" text-anchor="middle" class="s">actual fab stackup</text>
<path d="M275 543 L350 543" class="line"/>

<rect x="360" y="500" width="190" height="86" rx="12" class="c"/>
<text x="455" y="532" text-anchor="middle" class="h">Field / Crosstalk</text>
<text x="455" y="560" text-anchor="middle" class="s">S/H + parallel length</text>
<path d="M555 543 L630 543" class="line"/>

<rect x="640" y="500" width="190" height="86" rx="12" class="c"/>
<text x="735" y="532" text-anchor="middle" class="h">Target Z0</text>
<text x="735" y="560" text-anchor="middle" class="s">solver → width / gap</text>
<path d="M835 543 L910 543" class="line"/>

<rect x="920" y="500" width="190" height="86" rx="12" class="c"/>
<text x="1015" y="532" text-anchor="middle" class="h">Routing Density</text>
<text x="1015" y="560" text-anchor="middle" class="s">escape / pitch / margin</text>

<rect x="80" y="625" width="1030" height="52" rx="10" class="box"/>
<text x="595" y="657" text-anchor="middle" class="s">不要复制视频的 0.15 / 0.34 mm：current fab + current stackup + required impedance → 重新计算 → KiCad rule → fab freeze</text>
</svg>