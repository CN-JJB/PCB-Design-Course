<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd" stop-opacity=".6"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="60" y="65" font-size="34" font-family="sans-serif" font-weight="700">高速信号不是“一根线”：去程 + 回程 + 电磁场</text>
<text x="60" y="105" font-size="20" font-family="sans-serif" fill="#475569">以顶层微带线（Microstrip）为例：信号线与参考地平面共同构成传输结构</text>
<rect x="70" y="165" width="1060" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="170" y="230" width="860" height="28" rx="8" fill="#d97706"/>
<text x="520" y="218" font-size="22" font-family="sans-serif">信号铜线</text>
<path d="M250 244 H930" stroke="#2563eb" stroke-width="8" marker-end="url(#a)"/>
<text x="500" y="292" font-size="22" fill="#2563eb" font-family="sans-serif">去程电流 / Signal current</text>
<path d="M260 260 C330 350, 380 390, 450 430" stroke="#60a5fa" stroke-width="3" fill="none" opacity=".8"/>
<path d="M940 260 C870 350, 820 390, 750 430" stroke="#60a5fa" stroke-width="3" fill="none" opacity=".8"/>
<path d="M390 260 C440 330, 470 365, 520 430" stroke="#93c5fd" stroke-width="3" fill="none"/>
<path d="M810 260 C760 330, 730 365, 680 430" stroke="#93c5fd" stroke-width="3" fill="none"/>
<text x="470" y="365" font-size="20" font-family="sans-serif" fill="#475569">电场/磁场主要分布在导体周围</text>
<rect x="135" y="440" width="930" height="48" rx="6" fill="#64748b"/>
<text x="505" y="530" font-size="22" font-family="sans-serif">连续 GND 参考平面</text>
<path d="M920 464 H285" stroke="#dc2626" stroke-width="10" marker-end="url(#r)"/>
<text x="480" y="420" font-size="22" fill="#dc2626" font-family="sans-serif">高频回流集中在信号投影附近</text>
<rect x="80" y="610" width="1040" height="70" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="110" y="640" font-size="20" font-family="sans-serif" font-weight="700" fill="#1e3a8a">核心直觉</text>
<text x="220" y="640" font-size="20" font-family="sans-serif">真正要设计的是完整电流回路，而不是孤立的一根铜线。</text>
<text x="220" y="668" font-size="18" font-family="sans-serif" fill="#475569">参考平面连续 → 回路更紧凑；跨缝/远离参考 → 回流绕路、环路增大、SI/EMI 风险上升。</text>
</svg>