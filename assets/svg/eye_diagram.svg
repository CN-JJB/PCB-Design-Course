<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="500" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">眼图：所有高速问题的合影现场</text>

  <g transform="translate(110,64)">
    <line x1="0" y1="330" x2="740" y2="330" stroke="#333" marker-end="url(#ex)"/>
    <line x1="0" y1="330" x2="0" y2="20" stroke="#333" marker-end="url(#ex)"/>
    <text x="732" y="352" font-size="13">时间(对齐到比特中心)</text>
    <text x="-10" y="16" font-size="13">幅度</text>

    <!-- logic levels -->
    <line x1="0" y1="90" x2="740" y2="90" stroke="#bbb" stroke-dasharray="4,4"/>
    <text x="748" y="95" font-size="12.5" fill="#888">逻辑高</text>
    <line x1="0" y1="270" x2="740" y2="270" stroke="#bbb" stroke-dasharray="4,4"/>
    <text x="748" y="275" font-size="12.5" fill="#888">逻辑低</text>

    <!-- eye: multiple traces crossing between bit boundaries at x=370 -->
    <g stroke-width="2.2" fill="none" opacity=".9">
      <!-- upper traces converging to crossing -->
      <path d="M0,90 C120,92 240,120 350,168 C368,176 372,176 390,168 C500,120 620,92 740,90" stroke="#5c6bc0"/>
      <path d="M0,96 C130,102 250,138 352,172 C370,179 374,179 392,172 C504,134 618,98 740,96" stroke="#7986cb"/>
      <path d="M0,84 C110,84 235,108 348,164 C366,173 374,173 392,164 C506,106 630,84 740,84" stroke="#3949ab"/>
      <!-- lower traces -->
      <path d="M0,270 C120,268 240,240 350,192 C368,184 372,184 390,192 C500,240 620,268 740,270" stroke="#ef6c00"/>
      <path d="M0,264 C130,258 250,222 352,188 C370,181 374,181 392,188 C504,226 618,262 740,264" stroke="#ffa726"/>
      <path d="M0,276 C110,276 235,252 348,196 C366,187 374,187 392,196 C506,254 630,276 740,276" stroke="#e65100"/>
      <!-- jittered crossings (blurred X) -->
      <path d="M330,210 L410,150" stroke="#d33"/>
      <path d="M330,150 L410,210" stroke="#d33"/>
      <path d="M340,204 L400,156" stroke="#ff8a80"/>
      <path d="M340,156 L400,204" stroke="#ff8a80"/>
    </g>
    <ellipse cx="370" cy="180" rx="52" ry="66" fill="none" stroke="#2e7d32" stroke-dasharray="7,5" stroke-width="2"/>

    <!-- annotations -->
    <path d="M470,120 h-96" stroke="#555" marker-end="url(#er)"/>
    <text x="478" y="116" font-size="14.5" fill="#555">眼皮变薄 = 损耗 / ISI 码间干扰</text>
    <circle cx="370" cy="180" r="6" fill="none" stroke="#d33" stroke-width="2.5"/>
    <path d="M370,180 h96" stroke="#d33" marker-end="url(#err)"/>
    <text x="474" y="185" font-size="14.5" fill="#d33">交叉点模糊 = 抖动 Jitter（反射/串扰/SSN）</text>
    <path d="M300,180 h-190" stroke="#2e7d32" marker-end="url(#eg)"/>
    <text x="106" y="206" font-size="14.5" fill="#2e7d32">眼睛张开程度 = 链路质量余量</text>
    <text x="106" y="228" font-size="13.5" fill="#777">整体塌陷 → 阻抗失配的链式反射</text>
  </g>
  <defs>
    <marker id="ex" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#333"/></marker>
    <marker id="er" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#555"/></marker>
    <marker id="err" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#d33"/></marker>
    <marker id="eg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2e7d32"/></marker>
  </defs>
  <text x="480" y="478" text-anchor="middle" font-size="13" fill="#999">配套：《04_多层板理论/06_过孔串扰与高速专题》6.7 节——你学过的每一章都在这只眼睛里留下了痕迹</text>
</svg>
