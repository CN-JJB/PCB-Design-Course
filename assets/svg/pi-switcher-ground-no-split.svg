<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700">
<rect width="1180" height="700" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Switcher grounding: control the hot loop before you split the plane</text>
<g font-family="sans-serif">
<rect x="80" y="510" width="1020" height="40" fill="#475569"/>
<text x="90" y="585" font-size="17" fill="#334155">continuous GND reference</text>
<rect x="120" y="210" width="150" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="160" y="250" font-size="20" font-weight="700" fill="#1d4ed8">CIN</text>
<rect x="325" y="185" width="180" height="140" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="375" y="235" font-size="20" font-weight="700" fill="#991b1b">Switch IC</text>
<text x="360" y="266" font-size="16" fill="#991b1b">HS / LS FET</text>
<rect x="570" y="210" width="155" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="620" y="250" font-size="20" font-weight="700" fill="#92400e">L</text>
<rect x="790" y="210" width="150" height="90" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
<text x="830" y="250" font-size="20" font-weight="700" fill="#166534">COUT</text>

<path d="M195 305 C205 410 340 455 420 325" fill="none" stroke="#dc2626" stroke-width="7"/>
<path d="M420 325 C350 355 245 355 195 305" fill="none" stroke="#dc2626" stroke-width="7"/>
<text x="170" y="440" font-size="19" font-weight="700" fill="#991b1b">high-di/dt hot loop: keep tiny</text>
<rect x="385" y="150" width="180" height="32" rx="8" fill="#fecaca"/>
<text x="410" y="173" font-size="16" font-weight="700" fill="#991b1b">compact SW node</text>

<rect x="700" y="350" width="280" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="725" y="382" font-size="18" font-weight="700" fill="#0f172a">Do not use ground splits to fix:</text>
<text x="725" y="410" font-size="16" fill="#334155">• poor CIN placement</text>
<text x="725" y="435" font-size="16" fill="#334155">• oversized SW copper / bad FB route</text>

<rect x="80" y="625" width="1020" height="36" rx="10" fill="#e2e8f0"/>
<text x="104" y="649" font-size="16" fill="#334155">PGND / AGND pin names still matter: follow the device guide, but interpret the connection through real current paths and verify on hardware.</text>
</g></svg>