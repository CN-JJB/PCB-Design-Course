<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Microsoft YaHei, sans-serif">
  <rect width="960" height="480" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">阻抗失配的代价：过冲与振铃波形</text>

  <!-- axes -->
  <g transform="translate(90,60)">
    <line x1="0" y1="300" x2="800" y2="300" stroke="#333" marker-end="url(#ax)"/>
    <line x1="0" y1="300" x2="0" y2="20" stroke="#333" marker-end="url(#ax)"/>
    <text x="795" y="322" font-size="14">时间 t</text>
    <text x="-12" y="16" font-size="14">电压</text>

    <!-- ideal step -->
    <path d="M0,260 H180 L200,120 H800" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <text x="230" y="106" font-size="15" fill="#2e7d32" font-weight="bold">理想匹配：干净阶跃 Γ=0</text>

    <!-- ringing step: overshoot then decaying oscillation settling at same level -->
    <path d="M40,300 H430 C450,300 458,250 468,62 C474,34 480,34 486,62 C494,104 502,104 510,62 C518,38 526,38 534,62 C542,92 550,92 558,62 C566,44 574,44 582,62 C592,84 602,84 614,68 H800"
          fill="none" stroke="#d33" stroke-width="3"/>

    <!-- logic threshold lines -->
    <line x1="0" y1="170" x2="800" y2="170" stroke="#888" stroke-dasharray="6,5"/>
    <text x="806" y="175" font-size="13" fill="#777">逻辑阈值</text>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#bbb" stroke-dasharray="3,4"/>
    <circle cx="468" cy="62" r="5" fill="#d33"/>
    <text x="486" y="52" font-size="15" fill="#d33" font-weight="bold">过冲 Overshoot（可能超芯片耐压！）</text>
    <circle cx="492" cy="102" r="4" fill="#b06a10"/>
    <circle cx="510" cy="62" r="4" fill="#b06a10"/>
    <circle cx="528" cy="98" r="4" fill="#b06a10"/>
    <text x="560" y="128" font-size="15" fill="#b06a10" font-weight="bold">振铃多次穿越阈值 → 接收端误触发</text>

    <!-- time axis marks for round trip -->
    <line x1="430" y1="296" x2="430" y2="304" stroke="#333"/><text x="430" y="322" text-anchor="middle" font-size="13">T=单程延迟</text>
    <line x1="590" y1="296" x2="590" y2="304" stroke="#333"/><text x="590" y="322" text-anchor="middle" font-size="13">2T 反射回源</text>

    <text x="400" y="376" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Γ = (Z_L − Z₀)/(Z_L + Z₀)：末端开路 Γ=+1 全反射同相；末端匹配 Z_L=Z₀ 则 Γ=0 无反射</text>
    <text x="400" y="404" text-anchor="middle" font-size="14.5" fill="#2e7d32" font-weight="bold">解法三板斧：源端串阻 22~33Ω（CMOS 标配）／并联端接／戴维南</text>
  </g>
  <defs><marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#333"/></marker></defs>
  <text x="480" y="468" text-anchor="middle" font-size="13" fill="#999">动手验证：assets/html/ringing_simulator.html 可调 Rs/ZL/线长实时看波形 ＆ 实验四(电位器找最佳串阻)</text>
</svg>
