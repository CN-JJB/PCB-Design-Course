<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#333"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#d33"/></marker>
  </defs>
  <rect width="960" height="540" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">跨分割：回流被切断后发生了什么</text>

  <g transform="translate(90,64)">
    <!-- L1 signal crossing the gap -->
    <rect x="0" y="0" width="780" height="34" fill="#efe6cf" stroke="#c9bb92"/>
    <rect x="40" y="10" width="700" height="11" fill="#c47f3c"/>
    <path d="M60,16 h640" stroke="#d33" stroke-width="2" marker-end="url(#arR)"/>
    <text x="700" y="8" font-size="14" fill="#d33">信号 L1 →</text>
    <circle cx="390" cy="16" r="5" fill="none" stroke="#111" stroke-width="2"/>

    <!-- L2 split planes -->
    <rect x="0" y="46" width="330" height="92" fill="#4a7ba6" stroke="#2d547a"/>
    <text x="165" y="99" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">GND 平面</text>
    <rect x="450" y="46" width="330" height="92" fill="#c97f4a" stroke="#8a5527"/>
    <text x="615" y="99" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">PWR 区域</text>
    <rect x="330" y="40" width="120" height="104" fill="#fafafa" stroke="#d33" stroke-dasharray="6,4"/>
    <text x="390" y="86" text-anchor="middle" font-size="14" fill="#d33" font-weight="bold">分割缝</text>
    <text x="390" y="108" text-anchor="middle" font-size="13" fill="#d33">(≥0.5mm)</text>

    <!-- detour return path -->
    <path d="M390,140 C390,190 250,205 165,205 C120,205 95,160 95,120"
          fill="none" stroke="#d33" stroke-width="3.5" stroke-dasharray="9,6" marker-end="url(#arR)"/>
    <path d="M390,140 C390,190 545,205 615,205 C665,205 690,160 690,120"
          fill="none" stroke="#d33" stroke-width="3.5" stroke-dasharray="9,6" marker-end="url(#arR)"/>
    <text x="390" y="232" text-anchor="middle" font-size="15.5" fill="#d33" font-weight="bold">↑ 回流被缝切断，被迫绕行 → 环路面积暴涨</text>
  </g>

  <!-- consequences -->
  <g transform="translate(90,330)" font-size="15.5">
    <text x="0" y="0" font-weight="bold" fill="#222">三重危害（对应理论篇 3.2 场景一）：</text>
    <text x="0" y="34" fill="#333">① 环路面积 ↑↑ ⇒ 电感 ↑ ⇒ 该处呈高阻抗，边沿劣化</text>
    <text x="0" y="64" fill="#333">② 大环路 = 一圈天线 ⇒ 对外辐射飙升、也更容易接收干扰</text>
    <text x="0" y="94" fill="#333">③ 场泄漏增强 ⇒ 对邻近走线的串扰变大</text>
    <text x="0" y="132" fill="#2e7d32" font-weight="bold">修复优先级：改道绕开 &gt; 改层序规划 &gt; 缝上跨接电容(限频段) &gt; 改叠层</text>
  </g>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#999">配套：《04_多层板理论/03_回流路径与地弹》＋ 实验六（自制开槽测试板亲手验证）</text>
</svg>
