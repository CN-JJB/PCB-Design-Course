<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
<rect width="1180" height="660" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Reading impedance slopes on a log-log plot</text>
<g font-family="sans-serif">
<line x1="110" y1="540" x2="1060" y2="540" stroke="#64748b" stroke-width="3"/>
<line x1="110" y1="100" x2="110" y2="540" stroke="#64748b" stroke-width="3"/>
<text x="70" y="95" font-size="17" fill="#334155">|Z|</text><text x="990" y="575" font-size="17" fill="#334155">frequency →</text>
<path d="M160 430 L950 430" stroke="#16a34a" stroke-width="6"/>
<text x="890" y="410" font-size="20" font-weight="700" fill="#166534">R</text>
<path d="M170 500 L950 145" stroke="#2563eb" stroke-width="6"/>
<text x="900" y="125" font-size="20" font-weight="700" fill="#1d4ed8">L: +20 dB/dec</text>
<path d="M170 145 L950 500" stroke="#dc2626" stroke-width="6"/>
