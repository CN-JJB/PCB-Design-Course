<rect x="145" y="575" width="880" height="45" rx="10" fill="#e2e8f0"/>
<text x="170" y="603" font-size="16" fill="#334155">Slope gives a fast clue: falling = capacitive, flat = resistive, rising = inductive.</text>
</g></svg>