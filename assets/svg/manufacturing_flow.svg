<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="fr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#666"/></marker>
    <linearGradient id="stepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#37474f"/><stop offset="100%" stop-color="#546e7a"/></linearGradient>
  </defs>
  <rect width="960" height="620" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">四层板制造流程：12 步与它对你的设计意味着什么</text>

  <g transform="translate(80,58)" font-size="14.5">
    <!-- left column steps -->
    <g>
      <rect width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="22" fill="#fff">① 开料：大板裁切</text>
      <rect y="42" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="64" fill="#fff">② 内层图形：L2/L3 先单独成像蚀刻</text>
      <rect y="84" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="106" fill="#fff">③ 层压：芯板+PP+铜箔 高温高压合体</text>
      <rect y="126" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="148" fill="#fff">④ 钻孔：数控钻，最小孔径 0.2mm</text>
      <rect y="168" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="190" fill="#fff">⑤ 沉铜电镀：孔壁金属化 → 层间导通</text>
      <rect y="210" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="232" fill="#fff">⑥⑦ 外层图形 + 电镀加厚到目标铜厚</text>
    </g>
    <g transform="translate(500,0)">
      <rect y="0" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="22" fill="#fff">⑧ 蚀刻：去膜后蚀掉多余铜(有侧蚀!)</text>
      <rect y="42" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="64" fill="#fff">⑨ 阻焊：绿油印刷→曝光显影→开窗</text>
      <rect y="84" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="106" fill="#fff">⑩ 表面处理：ENIG/HASL 处理焊盘</text>
      <rect y="126" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="148" fill="#fff">⑪ 丝印：字符标记打印</text>
      <rect y="168" width="380" height="34" rx="6" fill="url(#stepg)"/><text x="14" y="190" fill="#fff">⑫ 成型测试：铣边→飞针测试→FQC</text>
    </g>
    <!-- arrows between columns -->
    <path d="M384,227 h108 v-210 h4" stroke="#666" stroke-width="2" fill="none" marker-end="url(#fr2)"/>

    <!-- design implications -->
    <g transform="translate(0,238)">
      <rect x="0" y="0" width="880" height="270" rx="10" fill="#fff" stroke="#ddd"/>
      <text x="24" y="36" font-size="16.5" font-weight="bold" fill="#222">这些工序如何反过来约束你的设计：</text>
      <text x="24" y="70" fill="#333">· 步骤②③ → 内外层分别成像再压合 ⇒ 每层介质厚度精确可控 = 阻抗控制的物理基础</text>
      <text x="24" y="102" fill="#333">· 步骤④ → 最小孔径 0.2mm ⇒ 你的过孔不能小于工厂能力(DRC 规则的来源)</text>
      <text x="24" y="134" fill="#333">· 步骤⑤ → 纵横比≤8:1 ⇒ 1.6mm 板厚对应 ≥0.2mm 孔径，不是巧合是因果</text>
      <text x="24" y="166" fill="#333">· 步骤⑧ → 蚀刻侧蚀 ⇒ 实际线宽略小于菲林 ⇒ 阻抗计算必须考虑铜厚截面梯形</text>
      <text x="24" y="198" fill="#333">· 步骤⑨ → 阻焊桥最小 0.08mm ⇒ 密脚 QFN 相邻开窗可能保不住桥</text>
      <text x="24" y="230" fill="#2e7d32" font-weight="bold">结论：DRC 的每一条规则都是某道工序的"翻译"。理解工艺=理解规则为什么存在。</text>
    </g>
  </g>
  <text x="480" y="600" text-anchor="middle" font-size="13" fill="#999">配套：《01_零基础入门/01_认识PCB》1.4 节 ＆ 《07_进阶专题/05_DFM》工厂能力表解读</text>
</svg>
