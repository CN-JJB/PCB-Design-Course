<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fbff"/><text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700">STM32F407 V2 → STM32H743 V3</text><g font-family="sans-serif"><rect x="70" y="110" width="300" height="390" rx="24" fill="#fff" stroke="#8fa9bf" stroke-width="2"/><text x="220" y="155" text-anchor="middle" font-size="25" font-weight="700">V2 · 4 Layer</text><text x="220" y="190" text-anchor="middle" font-size="17" fill="#52606d">STM32F407</text><text x="110" y="245" font-size="17">• USB FS</text><text x="110" y="280" font-size="17">• CAN</text><text x="110" y="315" font-size="17">• SDIO</text><text x="110" y="350" font-size="17">• SI / PI / EMC basics</text><text x="110" y="385" font-size="17">• Four-layer release gate</text><rect x="435" y="110" width="330" height="390" rx="24" fill="#eaf3ff" stroke="#4d88c7" stroke-width="3"/><text x="600" y="155" text-anchor="middle" font-size="25" font-weight="700" fill="#1d5fa7">Part 6 · Architecture</text><text x="475" y="225" font-size="17">1. Layer-count decision</text><text x="475" y="260" font-size="17">2. Six-layer stackup</text><text x="475" y="295" font-size="17">3. Reference mapping</text><text x="475" y="330" font-size="17">4. Return transition</text><text x="475" y="365" font-size="17">5. Power-domain overlay</text><text x="475" y="400" font-size="17">6. Manufacturer freeze</text><text x="475" y="435" font-size="17">7. Transition review</text><rect x="830" y="110" width="300" height="390" rx="24" fill="#fff" stroke="#7ab98b" stroke-width="3"/><text x="980" y="155" text-anchor="middle" font-size="25" font-weight="700" fill="#177245">V3 · 6 Layer</text><text x="980" y="190" text-anchor="middle" font-size="17" fill="#52606d">STM32H743ZIT6 · LQFP144</text><text x="870" y="245" font-size="17">• FMC SDRAM</text><text x="870" y="280" font-size="17">• Ethernet</text><text x="870" y="315" font-size="17">• Multiple power domains</text><text x="870" y="350" font-size="17">• More clocks / IO</text><text x="870" y="385" font-size="17">• Full SI/PI/EMC review</text><path d="M375 305 H425" stroke="#1d6fdc" stroke-width="7"/><path d="M775 305 H820" stroke="#1d6fdc" stroke-width="7"/><text x="600" y="555" text-anchor="middle" font-size="19" fill="#52606d">Part 6 freezes the electromagnetic environment before Part 7 routes high-speed buses</text></g></svg>