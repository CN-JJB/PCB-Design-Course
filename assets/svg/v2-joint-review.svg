<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.t{font-size:30px;font-weight:700}.h{font-size:24px;font-weight:700}.s{font-size:17px}.c{stroke:#334155;stroke-width:2}.a{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="55" y="55" class="t">Joint Review：同一结构同时被 SI / PI / EMC 看见</text><circle cx="600" cy="335" r="118" fill="#f8fafc" class="c"/><text x="525" y="320" class="h">Physical Structure</text><text x="520" y="355" class="s">Signal · Return · Power</text><text x="530" y="385" class="s">Transient · Geometry</text><circle cx="265" cy="220" r="105" fill="#dbeafe" class="c"/><text x="225" y="205" class="h">SI</text><text x="185" y="240" class="s">Z0 · reflection · skew</text><circle cx="265" cy="500" r="105" fill="#ffedd5" class="c"/><text x="225" y="485" class="h">PI</text><text x="170" y="520" class="s">PDN · droop · shared Z</text><circle cx="935" cy="220" r="105" fill="#ede9fe" class="c"/><text x="875" y="205" class="h">EMC</text><text x="845" y="240" class="s">DM/CM · cable · ESD</text><circle cx="935" cy="500" r="105" fill="#dcfce7" class="c"/><text x="875" y="485" class="h">DFM/Test</text><text x="842" y="520" class="s">fabricate · probe · release</text><path d="M360 245 L490 300" class="a"/><path d="M365 475 L490 390" class="a"/><path d="M840 245 L710 300" class="a"/><path d="M835 475 L710 390" class="a"/><text x="85" y="635" class="s">例：L2 reference slot → SI: return detour；PI: shared impedance；EMC: common-mode conversion；DFM: connector/via geometry 可能是根因。</text></svg>