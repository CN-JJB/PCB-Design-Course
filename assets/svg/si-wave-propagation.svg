<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><style>.t{font:22px sans-serif;fill:#1f2937}.s{font:18px sans-serif;fill:#374151}.sig{stroke:#d33;stroke-width:8;fill:none}.ret{stroke:#2674d9;stroke-width:7;fill:none}.plane{fill:#40566f}.die{fill:#f5e8c8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.field{stroke:#e7a328;stroke-width:2;fill:none;opacity:.7}</style><rect width="1000" height="430" fill="#fff"/><text x="50" y="45" class="t">PCB 上的边沿不是“瞬间到达”：它沿 signal + reference 构成的结构传播</text><rect x="55" y="85" width="120" height="75" rx="12" class="box"/><text x="82" y="130" class="t">Driver</text><rect x="825" y="85" width="120" height="75" rx="12" class="box"/><text x="855" y="130" class="t">Load</text><path d="M175 120 H825" class="sig"/><polygon points="815,110 840,120 815,130" fill="#d33"/><text x="420" y="95" class="s">incident voltage/current wave</text><rect x="175" y="175" width="650" height="90" class="die"/><rect x="175" y="265" width="650" height="34" class="plane"/><text x="420" y="292" fill="#fff" font-size="18" font-family="sans-serif">L2 GND reference plane</text><path d="M790 315 H210" class="ret"/><polygon points="220,305 195,315 220,325" fill="#2674d9"/><text x="390" y="345" class="s">return-current density follows the field structure</text><path d="M300 126 Q300 215 340 265 M420 126 Q420 215 460 265 M540 126 Q540 215 580 265 M660 126 Q660 215 700 265" class="field"/><text x="65" y="390" class="s">关键：能量主要存在于导体周围的电磁场；stackup 和 reference plane 是互连的一部分。</text></svg>