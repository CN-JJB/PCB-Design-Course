<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680"><rect width="1180" height="680" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Length matching is only a proxy for delay matching</text><g font-family="sans-serif"><rect x="70" y="105" width="490" height="460" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="100" y="145" font-size="22" font-weight="700" fill="#166534">Same layer / same geometry</text><path d="M120 250 H500" stroke="#2563eb" stroke-width="8"/><path d="M120 330 H500" stroke="#7c3aed" stroke-width="8"/><text x="130" y="220" font-size="17" fill="#334155">100 mm</text><text x="130" y="300" font-size="17" fill="#334155">100 mm</text><text x="130" y="410" font-size="18" fill="#166534">ΔL ≈ 0 → Δt often ≈ 0</text><text x="130" y="450" font-size="16" fill="#475569">Good first-order proxy when environments match.</text><rect x="620" y="105" width="490" height="460" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="650" y="145" font-size="22" font-weight="700" fill="#991b1b">Different layer / package / transition</text><path d="M670 250 H1040" stroke="#2563eb" stroke-width="8"/><path d="M670 330 H1040" stroke="#7c3aed" stroke-width="8"/><circle cx="860" cy="330" r="12" fill="#f59e0b"/><text x="680" y="220" font-size="17" fill="#334155">100 mm outer</text><text x="680" y="300" font-size="17" fill="#334155">100 mm inner + via/package offset</text><text x="680" y="410" font-size="18" fill="#991b1b">ΔL = 0 does not guarantee Δt = 0</text><text x="680" y="450" font-size="16" fill="#475569">Match die-to-die arrival time, not just CAD length.</text><rect x="90" y="610" width="1000" height="40" rx="10" fill="#e2e8f0"/><text x="115" y="636" font-size="16" fill="#334155">Constraint flow: timing spec → ps budget → layer delay model → equivalent mm → routing/tuning.</text></g></svg>