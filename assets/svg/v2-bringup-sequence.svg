<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:15px}.b{stroke:#334155;stroke-width:2;rx:15;ry:15}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="55" y="55" class="t">V2 Bring-up：一次只增加一个风险层</text><g><rect x="55" y="115" width="160" height="90" fill="#f1f5f9" class="b"/><text x="93" y="150" class="h">0 无电检查</text><text x="80" y="180" class="s">short · orientation</text><rect x="260" y="115" width="160" height="90" fill="#ffedd5" class="b"/><text x="305" y="150" class="h">1 Power</text><text x="287" y="180" class="s">5V · 3V3 · VCAP</text><rect x="465" y="115" width="160" height="90" fill="#ede9fe" class="b"/><text x="512" y="150" class="h">2 SWD</text><text x="493" y="180" class="s">ID · program · reset</text><rect x="670" y="115" width="160" height="90" fill="#dbeafe" class="b"/><text x="710" y="150" class="h">3 Clock</text><text x="698" y="180" class="s">HSE · PLL · 48MHz</text><rect x="875" y="115" width="160" height="90" fill="#dcfce7" class="b"/><text x="925" y="150" class="h">4 USB</text><text x="900" y="180" class="s">attach · enumerate</text><path d="M215 160 L260 160" class="a"/><path d="M420 160 L465 160" class="a"/><path d="M625 160 L670 160" class="a"/><path d="M830 160 L875 160" class="a"/></g><g><rect x="155" y="335" width="190" height="100" fill="#fee2e2" class="b"/><text x="215" y="375" class="h">5 CAN</text><text x="185" y="405" class="s">known-good node · errors</text><rect x="505" y="335" width="190" height="100" fill="#fef3c7" class="b"/><text x="560" y="375" class="h">6 SDIO</text><text x="530" y="405" class="s">init → read → write → stress</text><rect x="855" y="335" width="190" height="100" fill="#e0f2fe" class="b"/><text x="890" y="375" class="h">7 Combined</text><text x="875" y="405" class="s">USB + CAN + SD + CPU</text><path d="M345 385 L505 385" class="a"/><path d="M695 385 L855 385" class="a"/></g><rect x="345" y="525" width="510" height="95" fill="#f3e8ff" class="b"/><text x="445" y="563" class="h">8 Pre-compliance / Regression</text><text x="390" y="595" class="s">Near-field · cable A/B · thermal · power · repeatability · evidence log</text><path d="M950 435 C900 500 820 550 855 570" class="a"/><text x="70" y="665" class="s">出现异常时回到最近一个已知 PASS gate；不要在未知电源/时钟状态下同时调 USB、CAN 和 SDIO。</text></svg>