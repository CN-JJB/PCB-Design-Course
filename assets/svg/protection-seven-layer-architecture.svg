<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
<rect width="1180" height="760" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Seven protection layers: different threats, different actions</text>
<g font-family="sans-serif">
<rect x="70" y="105" width="1040" height="80" rx="18" fill="#fee2e2"/><text x="100" y="140" font-size="21" font-weight="700" fill="#991b1b">1. Overcurrent / short</text><text x="430" y="140" font-size="17" fill="#334155">fuse · PTC · eFuse · current limit</text>
<rect x="70" y="200" width="1040" height="80" rx="18" fill="#fff7ed"/><text x="100" y="235" font-size="21" font-weight="700" fill="#92400e">2. Reverse polarity / reverse current</text><text x="560" y="235" font-size="17" fill="#334155">diode · MOSFET · ideal-diode controller</text>
<rect x="70" y="295" width="1040" height="80" rx="18" fill="#fef3c7"/><text x="100" y="330" font-size="21" font-weight="700" fill="#92400e">3. Overvoltage</text><text x="360" y="330" font-size="17" fill="#334155">OVP cutoff for sustained faults · TVS / surge network for transients</text>
<rect x="70" y="390" width="1040" height="80" rx="18" fill="#ecfdf5"/><text x="100" y="425" font-size="21" font-weight="700" fill="#166534">4. Inrush / hot-plug</text><text x="385" y="425" font-size="17" fill="#334155">soft-start · hot-swap · programmable slew rate</text>
<rect x="70" y="485" width="1040" height="80" rx="18" fill="#dbeafe"/><text x="100" y="520" font-size="21" font-weight="700" fill="#1d4ed8">5. External-port ESD</text><text x="390" y="520" font-size="17" fill="#334155">TVS + low-inductance connector-boundary layout</text>
<rect x="70" y="580" width="1040" height="80" rx="18" fill="#ede9fe"/><text x="100" y="615" font-size="21" font-weight="700" fill="#6d28d9">6. Brownout / rail fault</text><text x="410" y="615" font-size="17" fill="#334155">BOR · voltage supervisor · reset IC</text>
<rect x="70" y="675" width="1040" height="55" rx="16" fill="#e2e8f0"/><text x="100" y="709" font-size="21" font-weight="700" fill="#0f172a">7. Firmware lockup → watchdog → reset → defined hardware safe state</text>
</g></svg>