<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:15px}.ball{fill:#d9e7f7;stroke:#56799f}.via{fill:#f6d79f;stroke:#b77d22}.trace{stroke:#b85050;stroke-width:5;fill:none}</style><rect width="1160" height="600" fill="#f8fbff"/><text x="45" y="48" class="t h">0.8 mm BGA Escape｜先算几何，再决定层数与工艺</text><g transform="translate(90,110)"><circle cx="0" cy="0" r="25" class="ball"/><circle cx="120" cy="0" r="25" class="ball"/><circle cx="240" cy="0" r="25" class="ball"/><circle cx="0" cy="120" r="25" class="ball"/><circle cx="120" cy="120" r="25" class="ball"/><circle cx="240" cy="120" r="25" class="ball"/><circle cx="0" cy="240" r="25" class="ball"/><circle cx="120" cy="240" r="25" class="ball"/><circle cx="240" cy="240" r="25" class="ball"/><circle cx="35" cy="35" r="17" class="via"/><circle cx="155" cy="35" r="17" class="via"/><circle cx="275" cy="35" r="17" class="via"/><path d="M35 35 L80 75 L160 75" class="trace"/><text x="120" y="300" text-anchor="middle" class="t s">dog-bone / via / channel</text></g><rect x="520" y="105" width="560" height="350" rx="18" fill="#fff" stroke="#7893b5" stroke-width="2"/><text x="800" y="150" text-anchor="middle" class="t b">Escape 需要一起检查</text><text x="560" y="205" class="t s">• ball pitch / BGA pad</text><text x="560" y="240" class="t s">• via drill / annular ring / via pad</text><text x="560" y="275" class="t s">• min trace / spacing / solder mask</text><text x="560" y="310" class="t s">• DDR3 / Clock / GTP priority corridor</text><text x="560" y="345" class="t s">• power/GND plane access</text><text x="560" y="380" class="t s">• board-house DFM / cost</text><text x="560" y="415" class="t s">• center-ball escape → layer-count evidence</text><text x="45" y="555" class="t b">0.8 mm pitch ≠ 自动需要 via-in-pad。先证明传统 fanout 不满足，再升级 HDI。</text></svg>