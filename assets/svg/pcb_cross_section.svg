<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <pattern id="fr4tex" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e8dfc8"/>
      <path d="M0,14 L14,0 M-3,3 L3,-3 M11,17 L17,11" stroke="#c9bb92" stroke-width="1.2"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">一块双层板的完整剖面结构（五层解剖）</text>

  <!-- board body -->
  <g transform="translate(120,80)">
    <!-- FR4 core -->
    <rect x="0" y="150" width="620" height="130" fill="url(#fr4tex)" stroke="#b3a67f"/>
    <text x="310" y="222" text-anchor="middle" font-size="20" fill="#7a6a3a">基板 Core（FR4 玻纤环氧，机械支撑）</text>
    <!-- bottom copper -->
    <rect x="0" y="280" width="620" height="18" fill="#c47f3c" stroke="#8a5527"/>
    <text x="700" y="295" font-size="16" fill="#8a5527">④ 底层铜箔（导电走线/敷铜）</text>
    <!-- top copper with traces -->
    <rect x="0" y="132" width="620" height="18" fill="#c47f3c" stroke="#8a5527"/>
    <text x="700" y="147" font-size="16" fill="#8a5527">③ 顶层铜箔 ★真正导电的部分</text>
    <!-- traces carved on top copper -->
    <path d="M60,132 h90 v-26 h70 v26 h120" fill="none" stroke="#e8b04a" stroke-width="12"/>
    <text x="180" y="86" font-size="15" fill="#a06a20">蚀刻后的走线 Trace</text>
    <!-- solder mask -->
    <rect x="0" y="96" width="620" height="36" fill="#2e7d32" opacity="0.55"/>
    <rect x="52" y="88" width="300" height="52" rx="4" fill="#2e7d32" opacity="0.28"/>
    <text x="700" y="118" font-size="16" fill="#2e5d32">② 阻焊层 Solder Mask（绿色油漆，开窗处露铜可焊）</text>
    <!-- silkscreen -->
    <text x="66" y="82" font-size="13" fill="#ffffff" font-weight="bold">R1</text>
    <text x="250" y="82" font-size="13" fill="#ffffff" font-weight="bold">C3</text>
    <text x="700" y="86" font-size="16" fill="#333">① 丝印 Silkscreen（白色字符 R1/C3、极性标记）</text>
    <!-- via -->
    <circle cx="430" cy="215" r="26" fill="#d9d9d9" stroke="#888"/>
    <circle cx="430" cy="215" r="14" fill="#c47f3c" stroke="#8a5527" stroke-width="3"/>
    <line x1="430" y1="132" x2="430" y2="298" stroke="#8a5527" stroke-width="6"/>
    <text x="470" y="205" font-size="15" fill="#8a5527">过孔 Via</text>
    <text x="470" y="226" font-size="13" fill="#777">孔壁沉铜电镀后导通上下层</text>
    <!-- pads -->
    <rect x="40" y="126" width="46" height="30" rx="4" fill="#e8b04a" stroke="#8a5527"/>
    <text x="30" y="118" font-size="13" fill="#a06a20">焊盘 Pad（开窗露铜）</text>
  </g>

  <!-- dimension callouts -->
  <g transform="translate(120,420)" font-size="14" fill="#555">
    <line x1="0" y1="0" x2="620" y2="0" stroke="#bbb" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="310" y="22" text-anchor="middle">板厚 1.6mm（常见值）｜铜厚 1oz = 35μm｜阻焊厚约 15~30μm</text>
  </g>
  <text x="480" y="495" text-anchor="middle" font-size="14" fill="#999">配套章节：《01_零基础入门/01_认识PCB》1.2 节</text>
</svg>
