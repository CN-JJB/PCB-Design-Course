<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="#fff"/><text x="550" y="45" font-size="28" text-anchor="middle" font-family="sans-serif" font-weight="700">Shield / Chassis / System Ground</text><rect x="70" y="110" width="250" height="200" rx="15" fill="#eef6ff" stroke="#6fa8dc" stroke-width="3"/><text x="195" y="150" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">System GND</text><text x="195" y="185" font-size="17" text-anchor="middle" font-family="sans-serif">MCU / signal return</text><line x1="120" y1="245" x2="270" y2="245" stroke="#333" stroke-width="8"/><rect x="425" y="130" width="250" height="160" rx="15" fill="#fce5cd" stroke="#c55a11" stroke-width="3"/><text x="550" y="175" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">Coupling Network</text><text x="550" y="210" font-size="17" text-anchor="middle" font-family="sans-serif">direct / 0Ω / C / RC</text><text x="550" y="240" font-size="15" text-anchor="middle" font-family="sans-serif">由整机结构决定</text><rect x="780" y="90" width="250" height="240" rx="15" fill="#e2f0d9" stroke="#548235" stroke-width="3"/><text x="905" y="135" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">Chassis / Shield</text><text x="905" y="175" font-size="17" text-anchor="middle" font-family="sans-serif">connector shell</text><text x="905" y="205" font-size="17" text-anchor="middle" font-family="sans-serif">enclosure / ESD path</text><line x1="320" y1="210" x2="425" y2="210" stroke="#777" stroke-width="5"/><line x1="675" y1="210" x2="780" y2="210" stroke="#777" stroke-width="5"/><path d="M905 245 C850 380 260 380 195 280" fill="none" stroke="#2673c9" stroke-width="5" stroke-dasharray="10 8"/><text x="550" y="390" font-size="18" text-anchor="middle" font-family="sans-serif" fill="#2673c9">高频电流路径应由系统结构定义，而不是只看 DC 是否“导通”</text></svg>