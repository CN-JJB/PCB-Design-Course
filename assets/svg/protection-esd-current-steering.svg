<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
<rect width="1180" height="660" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">ESD protection is current steering, not just a TVS symbol</text>
<g font-family="sans-serif">
<rect x="90" y="190" width="170" height="110" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="125" y="235" font-size="21" font-weight="700" fill="#334155">Connector</text><text x="120" y="265" font-size="16" fill="#475569">ESD entry point</text>
<rect x="405" y="190" width="160" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="465" y="235" font-size="21" font-weight="700" fill="#1d4ed8">TVS</text><text x="440" y="265" font-size="16" fill="#475569">clamp device</text>
<rect x="825" y="190" width="200" height="110" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="870" y="235" font-size="21" font-weight="700" fill="#166534">Protected IC</text><text x="850" y="265" font-size="16" fill="#475569">transceiver / MCU</text>
<path d="M260 245 H405" stroke="#ef4444" stroke-width="8"/><path d="M565 245 H825" stroke="#94a3b8" stroke-width="5"/>
<path d="M485 300 V455" stroke="#ef4444" stroke-width="9"/><path d="M485 455 H760" stroke="#ef4444" stroke-width="9"/>
<rect x="760" y="425" width="220" height="65" rx="14" fill="#e2e8f0" stroke="#64748b"/><text x="800" y="465" font-size="19" font-weight="700" fill="#334155">Chassis / GND path</text>
<text x="335" y="155" font-size="17" fill="#991b1b">keep connector→TVS path direct</text>
<text x="520" y="390" font-size="17" fill="#991b1b">minimize TVS discharge inductance</text>
<rect x="95" y="545" width="940" height="55" rx="12" fill="#fff7ed"/>
<text x="120" y="578" font-size="16" fill="#92400e">If PCB inductance is large, L·di/dt adds voltage on top of the TVS clamp voltage. Layout is part of the protection device.</text>
</g></svg>