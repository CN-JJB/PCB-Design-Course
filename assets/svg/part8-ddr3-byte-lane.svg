<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:15px}.fpga{fill:#eef5ff;stroke:#507ab1;stroke-width:2}.lane0{fill:#f5efff;stroke:#795fc0;stroke-width:2}.lane1{fill:#eef9f1;stroke:#4d9965;stroke-width:2}.mem{fill:#fff6e8;stroke:#d39430;stroke-width:2}.ln0{stroke:#795fc0;stroke-width:5}.ln1{stroke:#4d9965;stroke-width:5}.clk{stroke:#d13f3f;stroke-width:6}</style><rect width="1180" height="600" fill="#f8fbff"/><text x="45" y="48" class="t h">DDR3 x16｜DQS Byte Lane 是物理资源，不是命名习惯</text><rect x="60" y="110" width="310" height="365" rx="18" class="fpga"/><text x="215" y="155" text-anchor="middle" class="t b">Artix-7 DDR Bank(s)</text><rect x="95" y="200" width="240" height="100" rx="12" class="lane0"/><text x="215" y="238" text-anchor="middle" class="t b">Byte Lane 0</text><text x="215" y="270" text-anchor="middle" class="t s">DQS0 + DQ[7:0] + DM0</text><rect x="95" y="330" width="240" height="100" rx="12" class="lane1"/><text x="215" y="368" text-anchor="middle" class="t b">Byte Lane 1</text><text x="215" y="400" text-anchor="middle" class="t s">DQS1 + DQ[15:8] + DM1</text><rect x="820" y="130" width="280" height="320" rx="18" class="mem"/><text x="960" y="180" text-anchor="middle" class="t b">DDR3 x16</text><text x="960" y="220" text-anchor="middle" class="t s">AS4C64M16D3B</text><line x1="335" y1="250" x2="820" y2="250" class="ln0"/><line x1="335" y1="380" x2="820" y2="380" class="ln1"/><line x1="370" y1="165" x2="820" y2="165" class="clk"/><text x="570" y="145" class="t s">CK / Address / Command</text><text x="490" y="235" class="t s">DQS0 defines BL0 membership</text><text x="490" y="365" class="t s">DQS1 defines BL1 membership</text><text x="45" y="555" class="t b">流程：Memory spec → MIG legal bank/pins → PCB floorplan → legal swap → regenerate XDC。</text></svg>