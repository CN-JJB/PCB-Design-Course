<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
</defs>
<rect width="1180" height="620" rx="22" fill="#f8fafc"/>
<text x="55" y="50" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Signal Integrity：不是“某根线漂亮不漂亮”，而是接收端还能不能可靠重建信息</text>
<rect x="70" y="110" width="245" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="468" y="110" width="245" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<rect x="865" y="110" width="245" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="142" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Transmitter</text>
<text x="125" y="193" font-family="sans-serif" font-size="18" fill="#334155">driver / package / slew</text>
<text x="555" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="#92400e">Channel</text>
<text x="495" y="193" font-family="sans-serif" font-size="18" fill="#334155">trace / via / connector / cable</text>
<text x="942" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="#166534">Receiver</text>
<text x="900" y="193" font-family="sans-serif" font-size="18" fill="#334155">threshold / timing / margin</text>
<line x1="315" y1="170" x2="458" y2="170" stroke="#334155" stroke-width="5" marker-end="url(#arr)"/>
<line x1="713" y1="170" x2="855" y2="170" stroke="#334155" stroke-width="5" marker-end="url(#arr)"/>

<text x="70" y="290" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Channel 常见四类退化</text>

<rect x="70" y="330" width="235" height="160" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="95" y="368" font-family="sans-serif" font-size="20" font-weight="700" fill="#b91c1c">1. Impedance mismatch</text>
<text x="95" y="404" font-family="sans-serif" font-size="17" fill="#475569">geometry / via / stub</text>
<text x="95" y="432" font-family="sans-serif" font-size="17" fill="#475569">return discontinuity</text>
<text x="95" y="460" font-family="sans-serif" font-size="17" fill="#475569">→ reflection / ringing</text>

<rect x="335" y="330" width="235" height="160" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="360" y="368" font-family="sans-serif" font-size="20" font-weight="700" fill="#92400e">2. Frequency response</text>
<text x="360" y="404" font-family="sans-serif" font-size="17" fill="#475569">conductor + dielectric loss</text>
<text x="360" y="432" font-family="sans-serif" font-size="17" fill="#475569">high-frequency loss ↑</text>
<text x="360" y="460" font-family="sans-serif" font-size="17" fill="#475569">→ edge / ISI distortion</text>

<rect x="600" y="330" width="235" height="160" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="625" y="368" font-family="sans-serif" font-size="20" font-weight="700" fill="#6d28d9">3. Crosstalk / noise</text>
<text x="625" y="404" font-family="sans-serif" font-size="17" fill="#475569">mutual C / L</text>
<text x="625" y="432" font-family="sans-serif" font-size="17" fill="#475569">PI / EMI coupling</text>
<text x="625" y="460" font-family="sans-serif" font-size="17" fill="#475569">→ vertical eye closure</text>

<rect x="865" y="330" width="245" height="160" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="890" y="368" font-family="sans-serif" font-size="20" font-weight="700" fill="#0369a1">4. Jitter / timing</text>
<text x="890" y="404" font-family="sans-serif" font-size="17" fill="#475569">edge timing variation</text>
<text x="890" y="432" font-family="sans-serif" font-size="17" fill="#475569">data / clock uncertainty</text>
<text x="890" y="460" font-family="sans-serif" font-size="17" fill="#475569">→ horizontal eye closure</text>

<rect x="70" y="530" width="1040" height="54" rx="14" fill="#e2e8f0"/>
<text x="92" y="564" font-family="sans-serif" font-size="19" fill="#334155">Design goal: not “zero degradation”, but enough amplitude + timing margin for the receiver under defined conditions.</text>
</svg>