<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="#fff"/><text x="35" y="45" font-family="sans-serif" font-size="28" font-weight="700">Ground Bounce：共享电感上的 L·di/dt</text><rect x="90" y="110" width="260" height="220" rx="18" fill="#eef4ff" stroke="#456"/><text x="155" y="145" font-family="sans-serif" font-size="22">MCU / FPGA</text><text x="125" y="190" font-family="sans-serif" font-size="18">IO1 ─┐</text><text x="125" y="220" font-family="sans-serif" font-size="18">IO2 ─┼─ 同时切换</text><text x="125" y="250" font-family="sans-serif" font-size="18">IO3 ─┤</text><text x="125" y="280" font-family="sans-serif" font-size="18">IO4 ─┘</text><line x1="350" y1="270" x2="480" y2="270" stroke="#1677c8" stroke-width="7"/><path d="M480 270 q20 -45 40 0 q20 45 40 0 q20 -45 40 0" fill="none" stroke="#8b5a2b" stroke-width="5"/><text x="495" y="225" font-family="sans-serif" font-size="18">Lcommon</text><line x1="600" y1="270" x2="820" y2="270" stroke="#3f4a56" stroke-width="12"/><text x="675" y="305" font-family="sans-serif" font-size="18">PCB GND</text><path d="M410 130 C530 90 650 90 760 130" fill="none" stroke="#d33" stroke-width="5"/><text x="465" y="100" font-family="sans-serif" font-size="20" fill="#d33">Vbounce = Lcommon · Σ(di/dt)</text><text x="80" y="405" font-family="sans-serif" font-size="17" fill="#555">多个开关电流共享封装/过孔/地连接时，局部“地”会相对板级 GND 瞬间移动。</text></svg>