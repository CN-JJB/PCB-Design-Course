<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Power trace and signal trace: same copper, different first questions</text><g font-family="sans-serif"><rect x="70" y="100" width="500" height="480" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="105" y="145" font-size="24" font-weight="700" fill="#991b1b">Power / DC path</text><text x="105" y="200" font-size="19" fill="#334155">1. Maximum current?</text><text x="105" y="240" font-size="19" fill="#334155">2. Allowed voltage drop?</text><text x="105" y="280" font-size="19" fill="#334155">3. Allowed temperature rise?</text><text x="105" y="320" font-size="19" fill="#334155">4. Via / connector bottleneck?</text><text x="105" y="360" font-size="19" fill="#334155">5. Trace, pour or plane?</text><path d="M110 440 H480" stroke="#dc2626" stroke-width="16"/><text x="105" y="500" font-size="16" fill="#475569">ΔV, I²R, thermal spreading, current density</text><rect x="610" y="100" width="500" height="480" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="645" y="145" font-size="24" font-weight="700" fill="#1d4ed8">Fast signal path</text><text x="645" y="200" font-size="19" fill="#334155">1. Edge time / flight time?</text><text x="645" y="240" font-size="19" fill="#334155">2. Reference plane?</text><text x="645" y="280" font-size="19" fill="#334155">3. Z0 / topology / load?</text><text x="645" y="320" font-size="19" fill="#334155">4. Crosstalk / termination?</text><text x="645" y="360" font-size="19" fill="#334155">5. Delay / skew budget?</text><path d="M650 440 H1020" stroke="#2563eb" stroke-width="8"/><path d="M650 475 H1020" stroke="#475569" stroke-width="8"/><text x="645" y="525" font-size="16" fill="#475569">field geometry, transmission line, return path</text><rect x="90" y="620" width="1000" height="40" rx="10" fill="#e2e8f0"/><text x="115" y="646" font-size="16" fill="#334155">Do not use “current is small” to skip SI review, and do not use “trace is wide” to skip DC/thermal review.</text></g></svg>