<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:27px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#6f8ead;stroke-width:2}.ok{fill:#eef9f1;stroke:#4d9865;stroke-width:2}.bad{fill:#fff0f0;stroke:#c84a4a;stroke-width:2}.line{stroke:#73859b;stroke-width:3;fill:none}</style><rect width="1180" height="650" fill="#f8fbff"/><text x="45" y="45" class="t h">Bring-up Diagnosis｜一次只增加一个变量</text>
<rect x="430" y="80" width="320" height="80" rx="14" class="n"/><text x="590" y="128" text-anchor="middle" class="t b">Power / SWD / Clock baseline</text>
<path d="M590 160 V205" class="line"/><rect x="430" y="205" width="320" height="80" rx="14" class="n"/><text x="590" y="253" text-anchor="middle" class="t b">SDRAM basic pattern test</text>
<path d="M590 285 V330" class="line"/><rect x="410" y="330" width="360" height="90" rx="14" class="n"/><text x="590" y="370" text-anchor="middle" class="t b">Failure?</text><text x="590" y="400" text-anchor="middle" class="t s">address / bit / frequency / cache correlation</text>
<path d="M410 375 H260 V465" class="line"/><path d="M770 375 H930 V465" class="line"/>
<rect x="105" y="465" width="310" height="115" rx="14" class="bad"/><text x="260" y="500" text-anchor="middle" class="t b">Physical / Timing path</text><text x="260" y="532" text-anchor="middle" class="t s">pin · solder · mapping · FMC timing</text><text x="260" y="558" text-anchor="middle" class="t s">SDCLK · SI · PI · temperature</text>
<rect x="775" y="465" width="310" height="115" rx="14" class="ok"/><text x="930" y="500" text-anchor="middle" class="t b">Software / Coherency path</text><text x="930" y="532" text-anchor="middle" class="t s">cache · MPU · DMA · allocator</text><text x="930" y="558" text-anchor="middle" class="t s">MAC buffers · initialization order</text>
<text x="45" y="625" class="t s">A/B：降频、增 timing margin、改变 GPIO speed、装串阻、关 cache、降低并发；每次只改一个变量并保存 evidence。</text></svg>