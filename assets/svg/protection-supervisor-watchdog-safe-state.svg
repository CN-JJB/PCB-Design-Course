<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680">
<rect width="1180" height="680" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Brownout + watchdog: protection is complete only when reset leads to a safe state</text>
<g font-family="sans-serif">
<rect x="80" y="120" width="220" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="120" y="165" font-size="20" font-weight="700" fill="#6d28d9">Voltage supervisor</text><text x="125" y="195" font-size="16" fill="#475569">rail below threshold?</text>
<rect x="80" y="300" width="220" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="135" y="345" font-size="20" font-weight="700" fill="#1d4ed8">Watchdog</text><text x="120" y="375" font-size="16" fill="#475569">software heartbeat?</text>
<rect x="440" y="210" width="220" height="120" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="505" y="260" font-size="22" font-weight="700" fill="#334155">RESET</text><text x="475" y="292" font-size="16" fill="#475569">independent recovery path</text>
<rect x="800" y="180" width="260" height="180" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="860" y="225" font-size="22" font-weight="700" fill="#166534">Hardware safe state</text><text x="835" y="265" font-size="17" fill="#334155">motor enable = OFF</text><text x="835" y="295" font-size="17" fill="#334155">heater gate = LOW</text><text x="835" y="325" font-size="17" fill="#334155">relay driver = disabled</text>
<path d="M300 172 H440" stroke="#7c3aed" stroke-width="6"/><path d="M300 352 C365 352 370 300 440 285" stroke="#2563eb" stroke-width="6"/><path d="M660 270 H800" stroke="#16a34a" stroke-width="7"/>
<rect x="85" y="500" width="970" height="95" rx="14" fill="#fff7ed"/><text x="115" y="535" font-size="18" font-weight="700" fill="#92400e">Key review question</text><text x="115" y="568" font-size="17" fill="#334155">If the MCU is unpowered, brownout-reset, or firmware-locked, do external actuators still default to a safe electrical state?</text>
</g></svg>