<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690">
<rect width="1180" height="690" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">System impedance: many values can work if the whole channel is engineered consistently</text>

<g font-family="sans-serif">
  <rect x="75" y="105" width="1030" height="135" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <rect x="110" y="145" width="175" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="145" y="179" font-size="19" font-weight="700" fill="#1d4ed8">Driver / source</text>
  <line x1="285" y1="173" x2="495" y2="173" stroke="#dc2626" stroke-width="8"/>
  <text x="345" y="150" font-size="17" fill="#991b1b">Z₀ target</text>
  <rect x="495" y="145" width="180" height="55" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="526" y="179" font-size="19" font-weight="700" fill="#92400e">Interconnect</text>
  <line x1="675" y1="173" x2="850" y2="173" stroke="#dc2626" stroke-width="8"/>
  <rect x="850" y="145" width="210" height="55" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="885" y="179" font-size="19" font-weight="700" fill="#166534">Receiver / termination</text>

  <text x="95" y="305" font-size="21" font-weight="700" fill="#0f172a">Historical / system examples mentioned in the source</text>
  <rect x="95" y="345" width="300" height="145" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="125" y="385" font-size="26" font-weight="800" fill="#1d4ed8">~28 Ω</text>
  <text x="125" y="418" font-size="18" fill="#334155">Rambus memory example</text>
  <text x="125" y="450" font-size="16" fill="#64748b">low-Z system optimized around</text>
  <text x="125" y="474" font-size="16" fill="#64748b">driver / line / termination behavior</text>

  <rect x="440" y="345" width="300" height="145" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="470" y="385" font-size="26" font-weight="800" fill="#166534">50 Ω</text>
  <text x="470" y="418" font-size="18" fill="#334155">Common PCB / RF ecosystem</text>
  <text x="470" y="450" font-size="16" fill="#64748b">a practical compromise across</text>
  <text x="470" y="474" font-size="16" fill="#64748b">manufacture, power, crosstalk, test</text>

  <rect x="785" y="345" width="300" height="145" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="815" y="385" font-size="26" font-weight="800" fill="#92400e">~66 Ω</text>
  <text x="815" y="418" font-size="18" fill="#334155">IBM / Cray anecdotal example</text>
  <text x="815" y="450" font-size="16" fill="#64748b">kept as source-specific history,</text>
  <text x="815" y="474" font-size="16" fill="#64748b">not a universal modern target</text>

  <rect x="75" y="550" width="1030" height="78" rx="14" fill="#fff7ed"/>
  <text x="102" y="582" font-size="18" font-weight="700" fill="#92400e">Key lesson</text>
  <text x="102" y="610" font-size="17" fill="#334155">A 28 Ω, 50 Ω or 66 Ω system can all work; problems start when the channel changes impedance unexpectedly or interfaces are mismatched.</text>
</g>
</svg>