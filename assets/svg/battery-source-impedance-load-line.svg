<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700">
<rect width="1180" height="700" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Battery voltage sag is a source-impedance problem</text>
<g font-family="sans-serif">
<rect x="75" y="110" width="480" height="440" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="105" y="150" font-size="21" font-weight="700" fill="#0f172a">Equivalent source model</text>
<circle cx="180" cy="290" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="145" y="285" font-size="18" font-weight="700" fill="#1d4ed8">V_OC</text>
<text x="142" y="312" font-size="15" fill="#334155">chemical source</text>
<rect x="315" y="255" width="110" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
<text x="335" y="285" font-size="18" font-weight="700" fill="#92400e">R_internal</text>
<text x="345" y="311" font-size="15" fill="#475569">age / temp / SoC</text>
<path d="M235 290 H315 M425 290 H500" stroke="#64748b" stroke-width="7"/>
<rect x="445" y="240" width="80" height="100" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
<text x="462" y="292" font-size="18" font-weight="700" fill="#166534">LOAD</text>
<text x="110" y="430" font-size="20" font-weight="700" fill="#991b1b">VLOAD = VOC − I · Rinternal</text>
<text x="110" y="465" font-size="16" fill="#475569">Pulse current + rising cell impedance → regulator dropout / BOR.</text>

<rect x="615" y="110" width="490" height="440" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="645" y="150" font-size="21" font-weight="700" fill="#0f172a">Same battery, different load</text>
<line x1="675" y1="500" x2="1060" y2="500" stroke="#64748b" stroke-width="3"/><line x1="675" y1="200" x2="675" y2="500" stroke="#64748b" stroke-width="3"/>
<path d="M700 250 H840 V285 H980" fill="none" stroke="#22c55e" stroke-width="6"/>
<text x="845" y="238" font-size="16" fill="#166534">light load</text>
<path d="M700 250 H840 V390 H980" fill="none" stroke="#ef4444" stroke-width="6"/>
<text x="845" y="420" font-size="16" fill="#991b1b">heavy pulse load</text>
<line x1="700" y1="455" x2="1020" y2="455" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="865" y="478" font-size="15" fill="#92400e">system brownout threshold</text>

<rect x="80" y="600" width="1010" height="44" rx="10" fill="#e2e8f0"/>
<text x="104" y="628" font-size="16" fill="#334155">mAh alone does not determine usable runtime; pulse sag and the system’s minimum operating voltage often end the mission first.</text>
</g></svg>