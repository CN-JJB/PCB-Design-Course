<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:15px}</style><rect width="1100" height="620" fill="#f8fbff"/><text x="45" y="48" class="t h">Production Test Pyramid｜越往上越像产品，越往下越容易定位制造缺陷</text><polygon points="550,100 120,530 980,530" fill="#fff" stroke="#758da9" stroke-width="3"/><line x1="205" y1="445" x2="895" y2="445" stroke="#758da9" stroke-width="2"/><line x1="290" y1="360" x2="810" y2="360" stroke="#758da9" stroke-width="2"/><line x1="375" y1="275" x2="725" y2="275" stroke="#758da9" stroke-width="2"/><line x1="460" y1="190" x2="640" y2="190" stroke="#758da9" stroke-width="2"/><text x="550" y="150" text-anchor="middle" class="t b">Stress / Sample</text><text x="550" y="238" text-anchor="middle" class="t b">Functional Test</text><text x="550" y="325" text-anchor="middle" class="t b">Structural / Programming</text><text x="550" y="410" text-anchor="middle" class="t b">Assembly Inspection</text><text x="550" y="495" text-anchor="middle" class="t b">Bare-Board Electrical Test</text><text x="45" y="580" class="t s">设计目标：用合适成本和 cycle time 拦住最可能的 defect，并输出可定位 failure code。</text></svg>