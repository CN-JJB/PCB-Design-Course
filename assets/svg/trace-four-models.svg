<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">One PCB trace, four engineering models</text><g font-family="sans-serif"><rect x="70" y="110" width="240" height="220" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="150" font-size="22" font-weight="700" fill="#991b1b">R · DC / thermal</text><path d="M110 225 H260" stroke="#dc2626" stroke-width="10"/><text x="105" y="280" font-size="16" fill="#334155">ΔV = I·R</text><text x="105" y="305" font-size="16" fill="#334155">P = I²R</text><rect x="330" y="110" width="240" height="220" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="360" y="150" font-size="22" font-weight="700" fill="#92400e">L · current loop</text><path d="M370 220 C400 175 430 265 460 220 C490 175 520 265 550 220" fill="none" stroke="#f59e0b" stroke-width="7"/><text x="365" y="290" font-size="16" fill="#334155">V = L·di/dt</text><rect x="590" y="110" width="240" height="220" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="620" y="150" font-size="22" font-weight="700" fill="#166534">C · field coupling</text><line x1="650" y1="220" x2="770" y2="220" stroke="#16a34a" stroke-width="8"/><line x1="650" y1="260" x2="770" y2="260" stroke="#475569" stroke-width="8"/><text x="625" y="300" font-size="16" fill="#334155">to reference / neighbors</text><rect x="850" y="110" width="260" height="220" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="880" y="150" font-size="22" font-weight="700" fill="#1d4ed8">L′/C′ · transmission line</text><path d="M885 235 H1070" stroke="#2563eb" stroke-width="8"/><path d="M885 275 H1070" stroke="#475569" stroke-width="8"/><text x="890" y="310" font-size="16" fill="#334155">Z0 + propagation delay</text><rect x="100" y="430" width="980" height="150" rx="20" fill="#e2e8f0"/><text x="130" y="470" font-size="22" font-weight="700" fill="#0f172a">Which model dominates?</text><text x="130" y="510" font-size="17" fill="#334155">Current + length + copper geometry + reference plane + edge time + load + frequency.</text><text x="130" y="545" font-size="17" fill="#334155">The mistake is not using a simple model—the mistake is using the wrong simple model outside its valid range.</text></g></svg>