<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><defs><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d33"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2673c9"/></marker></defs><rect width="1000" height="430" fill="#fff"/><text x="250" y="45" font-size="28" text-anchor="middle" font-family="sans-serif" font-weight="700">Differential Mode</text><line x1="90" y1="140" x2="410" y2="140" stroke="#d33" stroke-width="8" marker-end="url(#r)"/><line x1="410" y1="240" x2="90" y2="240" stroke="#2673c9" stroke-width="8" marker-end="url(#b)"/><path d="M90 140 Q40 190 90 240" fill="none" stroke="#777" stroke-width="3"/><path d="M410 140 Q460 190 410 240" fill="none" stroke="#777" stroke-width="3"/><text x="250" y="310" font-size="20" text-anchor="middle" font-family="sans-serif">去程与回程方向相反 → 小 loop</text><text x="750" y="45" font-size="28" text-anchor="middle" font-family="sans-serif" font-weight="700">Common Mode</text><line x1="590" y1="140" x2="910" y2="140" stroke="#d33" stroke-width="8" marker-end="url(#r)"/><line x1="590" y1="220" x2="910" y2="220" stroke="#d33" stroke-width="8" marker-end="url(#r)"/><path d="M910 140 Q970 180 930 330" fill="none" stroke="#2673c9" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#b)"/><line x1="560" y1="350" x2="940" y2="350" stroke="#333" stroke-width="6"/><text x="750" y="310" font-size="20" text-anchor="middle" font-family="sans-serif">两线同向电流 → 经环境/机壳杂散回路返回</text><text x="750" y="390" font-size="18" text-anchor="middle" font-family="sans-serif" fill="#555">长电缆可能成为高效辐射结构</text></svg>