<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fafcff"/><text x="600" y="48" text-anchor="middle" font-size="31" font-family="sans-serif" font-weight="700">Six-layer stackup: judge adjacency, not labels</text><g font-family="sans-serif"><rect x="70" y="90" width="500" height="500" rx="24" fill="#fff" stroke="#7ab98b" stroke-width="3"/><text x="320" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#177245">Reference-aware candidate</text><g font-size="17"><rect x="145" y="165" width="350" height="42" fill="#d38b2c"/><text x="320" y="192" text-anchor="middle" fill="#fff">L1 SIGNAL</text><rect x="145" y="215" width="350" height="42" fill="#374957"/><text x="320" y="242" text-anchor="middle" fill="#fff">L2 SOLID GND</text><rect x="145" y="285" width="350" height="42" fill="#4d88c7"/><text x="320" y="312" text-anchor="middle" fill="#fff">L3 SIGNAL</text><rect x="145" y="375" width="350" height="42" fill="#9a71c6"/><text x="320" y="402" text-anchor="middle" fill="#fff">L4 POWER</text><rect x="145" y="445" width="350" height="42" fill="#374957"/><text x="320" y="472" text-anchor="middle" fill="#fff">L5 SOLID GND</text><rect x="145" y="495" width="350" height="42" fill="#d38b2c"/><text x="320" y="522" text-anchor="middle" fill="#fff">L6 SIGNAL</text></g><path d="M125 184 H145 M125 236 H145 M495 464 H525 M495 516 H525" stroke="#1d6fdc" stroke-width="4"/><text x="320" y="570" text-anchor="middle" font-size="16" fill="#52606d">Check dielectric spacing and actual coupling</text><rect x="630" y="90" width="500" height="500" rx="24" fill="#fff" stroke="#e07b73" stroke-width="3"/><text x="880" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#b42318">Looks neat, but risky</text><rect x="705" y="165" width="350" height="42" fill="#d38b2c"/><text x="880" y="192" text-anchor="middle" font-size="17" fill="#fff">L1 SIGNAL</text><rect x="705" y="215" width="350" height="42" fill="#9a71c6"/><text x="880" y="242" text-anchor="middle" font-size="17" fill="#fff">L2 SPLIT POWER</text><rect x="705" y="270" width="350" height="42" fill="#4d88c7"/><text x="880" y="297" text-anchor="middle" font-size="17" fill="#fff">L3 SIGNAL</text><rect x="705" y="320" width="350" height="42" fill="#4d88c7"/><text x="880" y="347" text-anchor="middle" font-size="17" fill="#fff">L4 SIGNAL</text><rect x="705" y="395" width="350" height="42" fill="#374957"/><text x="880" y="422" text-anchor="middle" font-size="17" fill="#fff">L5 GND</text><rect x="705" y="465" width="350" height="42" fill="#d38b2c"/><text x="880" y="492" text-anchor="middle" font-size="17" fill="#fff">L6 SIGNAL</text><path d="M780 313 C830 365 930 365 980 313" fill="none" stroke="#b42318" stroke-width="5" stroke-dasharray="9 8"/><text x="880" y="545" text-anchor="middle" font-size="16" fill="#b42318">Signal-signal coupling + split-reference ambiguity</text><text x="880" y="572" text-anchor="middle" font-size="15" fill="#52606d">Layer count alone does not create SI</text></g></svg>