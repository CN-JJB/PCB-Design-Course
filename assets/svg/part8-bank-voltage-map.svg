<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:16px}.b33{fill:#eef5ff;stroke:#4677b5;stroke-width:2}.b18{fill:#eef9f1;stroke:#4f9964;stroke-width:2}.b15{fill:#f5efff;stroke:#7d62c0;stroke-width:2}.bad{fill:#fff0f0;stroke:#cc4c4c;stroke-width:3}</style><rect width="1150" height="560" fill="#f8fbff"/><text x="45" y="48" class="t h">FPGA Bank Voltage Map｜Pin 不是独立电压岛</text><rect x="80" y="110" width="285" height="250" rx="18" class="b33"/><text x="222" y="150" text-anchor="middle" class="t b">Bank A · VCCO = 3.3 V</text><text x="222" y="200" text-anchor="middle" class="t s">LVCMOS33 GPIO</text><text x="222" y="235" text-anchor="middle" class="t s">Config / Header</text><rect x="430" y="110" width="285" height="250" rx="18" class="b18"/><text x="572" y="150" text-anchor="middle" class="t b">Bank B · VCCO = 1.8 V</text><text x="572" y="200" text-anchor="middle" class="t s">LVCMOS18</text><text x="572" y="235" text-anchor="middle" class="t s">Low-voltage peripheral</text><rect x="780" y="110" width="285" height="250" rx="18" class="b15"/><text x="922" y="150" text-anchor="middle" class="t b">DDR Bank · VCCO = 1.5 V</text><text x="922" y="200" text-anchor="middle" class="t s">SSTL15 / DQS / DQ</text><text x="922" y="235" text-anchor="middle" class="t s">MIG / VREF / DCI</text><rect x="280" y="410" width="590" height="95" rx="16" class="bad"/><text x="575" y="450" text-anchor="middle" class="t b">错误：同一个 Bank 同时要求 3.3 V GPIO + 1.5 V DDR3</text><text x="575" y="482" text-anchor="middle" class="t s">IOSTANDARD 文字不能改变实际 VCCO。Bank 是物理供电边界。</text></svg>