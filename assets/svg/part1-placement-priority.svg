<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.board{fill:#e8f5e9;stroke:#2f855a;stroke-width:4}.mcu{fill:#1f2937}.power{fill:#fed7aa;stroke:#ea580c}.clock{fill:#ede9fe;stroke:#7c3aed}.dbg{fill:#dbeafe;stroke:#2563eb}.conn{fill:#fef3c7;stroke:#ca8a04}.cap{fill:#f8fafc;stroke:#475569}.line{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}</style><rect width="1200" height="650" fill="white"/><text x="600" y="44" text-anchor="middle" class="title">STM32F407 V1｜布局优先级：先约束、再电流环路、最后整理</text><rect x="100" y="90" width="760" height="480" rx="20" class="board"/><circle cx="135" cy="125" r="14" fill="white" stroke="#64748b" stroke-width="4"/><circle cx="825" cy="125" r="14" fill="white" stroke="#64748b" stroke-width="4"/><circle cx="135" cy="535" r="14" fill="white" stroke="#64748b" stroke-width="4"/><circle cx="825" cy="535" r="14" fill="white" stroke="#64748b" stroke-width="4"/><rect x="415" y="260" width="150" height="150" rx="8" class="mcu"/><text x="490" y="337" text-anchor="middle" class="h" fill="white">STM32F407</text><rect x="165" y="205" width="160" height="120" rx="12" class="power"/><text x="245" y="250" text-anchor="middle" class="h">POWER</text><text x="245" y="280" text-anchor="middle" class="t">5V → LDO → 3V3</text><rect x="595" y="250" width="130" height="85" rx="12" class="clock"/><text x="660" y="285" text-anchor="middle" class="h">HSE</text><text x="660" y="312" text-anchor="middle" class="t">tight local loop</text><rect x="695" y="440" width="125" height="75" rx="10" class="dbg"/><text x="758" y="472" text-anchor="middle" class="h">SWD</text><text x="758" y="498" text-anchor="middle" class="t">board edge</text><rect x="105" y="360" width="105" height="70" rx="10" class="conn"/><text x="158" y="400" text-anchor="middle" class="t">Power IN</text><rect x="350" y="95" width="260" height="55" rx="10" class="conn"/><text x="480" y="128" text-anchor="middle" class="t">Expansion / UART connectors</text><g><rect x="385" y="228" width="30" height="18" class="cap"/><rect x="566" y="275" width="30" height="18" class="cap"/><rect x="395" y="420" width="30" height="18" class="cap"/><rect x="552" y="420" width="30" height="18" class="cap"/><text x="490" y="466" text-anchor="middle" class="t">local decoupling hugs the MCU</text></g><line x1="325" y1="265" x2="415" y2="305" class="line"/><line x1="565" y1="305" x2="595" y2="292" class="line"/><line x1="565" y1="370" x2="695" y2="455" class="line"/><g transform="translate(900,105)"><text x="0" y="0" class="h">布局顺序</text><text x="0" y="45" class="t">① 板框 / 安装孔 / 接口</text><text x="0" y="82" class="t">② 电源入口与稳压器</text><text x="0" y="119" class="t">③ MCU 朝向与功能流向</text><text x="0" y="156" class="t">④ VCAP / local decoupling</text><text x="0" y="193" class="t">⑤ HSE 小回路</text><text x="0" y="230" class="t">⑥ SWD / reset / boot</text><text x="0" y="267" class="t">⑦ 普通 GPIO / LED</text><text x="0" y="322" class="h">判断标准</text><text x="0" y="360" class="t">不是“飞线最少”单一指标，</text><text x="0" y="390" class="t">而是关键环路更短、参考</text><text x="0" y="420" class="t">关系更清楚、调试更方便。</text></g><text x="600" y="620" text-anchor="middle" class="t">示意位置仅用于教学。真正 placement 必须同时满足封装、机械、热、电源、时钟与接口约束。</text></svg>