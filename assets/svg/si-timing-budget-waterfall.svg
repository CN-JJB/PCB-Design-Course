<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Timing budget: PCB skew is only one piece of the margin</text><g font-family="sans-serif"><rect x="90" y="115" width="980" height="70" rx="16" fill="#dbeafe"/><text x="120" y="158" font-size="22" font-weight="700" fill="#1d4ed8">Interface timing window / skew specification</text><path d="M210 215 H970" stroke="#64748b" stroke-width="6"/><rect x="150" y="250" width="170" height="110" rx="14" fill="#fee2e2"/><text x="180" y="290" font-size="18" font-weight="700" fill="#991b1b">TX uncertainty</text><text x="180" y="320" font-size="15" fill="#475569">PVT / tCO</text><rect x="350" y="250" width="170" height="110" rx="14" fill="#fff7ed"/><text x="385" y="290" font-size="18" font-weight="700" fill="#92400e">Clock jitter</text><text x="385" y="320" font-size="15" fill="#475569">source / PLL</text><rect x="550" y="250" width="170" height="110" rx="14" fill="#f3e8ff"/><text x="580" y="290" font-size="18" font-weight="700" fill="#6d28d9">Package skew</text><text x="585" y="320" font-size="15" fill="#475569">TX + RX</text><rect x="750" y="250" width="170" height="110" rx="14" fill="#ecfdf5"/><text x="795" y="290" font-size="18" font-weight="700" fill="#166534">PCB skew</text><text x="785" y="320" font-size="15" fill="#475569">routing / vias</text><rect x="270" y="430" width="640" height="100" rx="16" fill="#e2e8f0"/><text x="320" y="470" font-size="21" font-weight="700" fill="#0f172a">Remaining setup / hold margin</text><text x="320" y="502" font-size="16" fill="#475569">Do not allocate the whole published limit to PCB mismatch.</text><rect x="105" y="595" width="970" height="44" rx="10" fill="#fff7ed"/><text x="130" y="623" font-size="16" fill="#92400e">Every derating percentage must come from the actual protocol/device/project decision—not from a generic internet table.</text></g></svg>