<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fbff"/><text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700">Layer transition = signal transition + return transition</text><g font-family="sans-serif"><rect x="80" y="100" width="480" height="460" rx="22" fill="#fff" stroke="#7bb88a" stroke-width="3"/><text x="320" y="140" text-anchor="middle" font-size="23" font-weight="700">GND → GND</text><line x1="140" y1="210" x2="490" y2="210" stroke="#d64545" stroke-width="10"/><line x1="140" y1="290" x2="490" y2="290" stroke="#374957" stroke-width="18"/><line x1="140" y1="420" x2="490" y2="420" stroke="#374957" stroke-width="18"/><line x1="315" y1="210" x2="315" y2="500" stroke="#d64545" stroke-width="10"/><line x1="355" y1="290" x2="355" y2="420" stroke="#2f79c5" stroke-width="10"/><path d="M180 275 C240 250 280 250 315 250" fill="none" stroke="#2f79c5" stroke-width="6"/><path d="M355 455 C400 455 445 448 485 430" fill="none" stroke="#2f79c5" stroke-width="6"/><text x="320" y="535" text-anchor="middle" font-size="16" fill="#177245">Local GND stitching via supports return transfer</text><rect x="640" y="100" width="480" height="460" rx="22" fill="#fff" stroke="#e07b73" stroke-width="3"/><text x="880" y="140" text-anchor="middle" font-size="23" font-weight="700">GND → PWR</text><line x1="700" y1="210" x2="1050" y2="210" stroke="#d64545" stroke-width="10"/><line x1="700" y1="290" x2="1050" y2="290" stroke="#374957" stroke-width="18"/><line x1="700" y1="420" x2="1050" y2="420" stroke="#9a71c6" stroke-width="18"/><line x1="875" y1="210" x2="875" y2="500" stroke="#d64545" stroke-width="10"/><path d="M760 275 C820 250 850 250 875 250" fill="none" stroke="#2f79c5" stroke-width="6"/><rect x="940" y="330" width="70" height="48" rx="8" fill="#fff3cd" stroke="#d49a00" stroke-width="3"/><text x="975" y="360" text-anchor="middle" font-size="15">Cdec</text><line x1="975" y1="290" x2="975" y2="330" stroke="#2f79c5" stroke-width="6"/><line x1="975" y1="378" x2="975" y2="420" stroke="#2f79c5" stroke-width="6"/><path d="M875 455 C915 455 945 445 975 420" fill="none" stroke="#2f79c5" stroke-width="6"/><text x="880" y="535" text-anchor="middle" font-size="16" fill="#b42318">Need a low-inductance GND↔PWR transfer path</text><text x="600" y="610" text-anchor="middle" font-size="17" fill="#52606d">Red = outgoing signal · Blue = return / reference transfer</text></g></svg>