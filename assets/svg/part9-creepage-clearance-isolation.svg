<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">Clearance 与 Creepage：都是“间距”，但走的不是同一条路</text>
<rect x="120" y="210" width="300" height="130" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="270" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Primary 铜区</text>
<rect x="780" y="210" width="300" height="130" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="930" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Secondary 铜区</text>
<line x1="420" y1="245" x2="780" y2="245" stroke="#333" stroke-width="4"/>
<text x="600" y="218" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Clearance：穿过空气的最短距离</text>
<path d="M420 335 C520 430 680 430 780 335" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="12 8"/>
<text x="600" y="470" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Creepage：沿绝缘表面的最短路径</text>
<rect x="540" y="300" width="120" height="180" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="600" y="397" text-anchor="middle" font-family="sans-serif" font-size="18" transform="rotate(-90 600 397)">Isolation slot</text>
<text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="21">Slot 可以改变表面路径，但不能把错误的空气间隙“变没”。</text>
<text x="600" y="605" text-anchor="middle" font-family="sans-serif" font-size="19">Mixed-signal 的 AGND/DGND 分区 ≠ 安全隔离；primary/secondary 是另一类问题。</text>
<text x="600" y="655" text-anchor="middle" font-family="sans-serif" font-size="16">Release 时以适用产品安全标准、工作电压、污染等级、材料组和海拔为准；不要只背 IPC-2221 表格。</text>
</svg>