<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect width="960" height="480" fill="#fff"/><text x="35" y="45" font-family="sans-serif" font-size="28" font-weight="700">测电源噪声：探头回路也会影响结果</text><text x="160" y="95" font-family="sans-serif" font-size="22" fill="#b22">Bad: long ground lead</text><line x1="100" y1="220" x2="350" y2="220" stroke="#b87333" stroke-width="10"/><circle cx="215" cy="220" r="10" fill="#d33"/><path d="M215 220 C205 150 210 120 255 110" fill="none" stroke="#333" stroke-width="5"/><path d="M255 110 C330 115 355 165 355 260 C355 325 300 355 190 340" fill="none" stroke="#1677c8" stroke-width="5"/><text x="105" y="375" font-family="sans-serif" font-size="17" fill="#b22">大测量环路 → 易拾取场 / 产生假振铃</text><text x="640" y="95" font-family="sans-serif" font-size="22" fill="#27833b">Better: ground spring</text><line x1="570" y1="220" x2="840" y2="220" stroke="#b87333" stroke-width="10"/><circle cx="685" cy="220" r="10" fill="#d33"/><path d="M685 220 C680 170 690 145 720 140" fill="none" stroke="#333" stroke-width="5"/><path d="M720 140 C760 145 770 175 765 220" fill="none" stroke="#1677c8" stroke-width="5"/><text x="590" y="375" font-family="sans-serif" font-size="17" fill="#27833b">小测量环路 → 更低寄生、更少场拾取</text><text x="65" y="440" font-family="sans-serif" font-size="16" fill="#555">同一测点比较不同 ground connection，是判断“真实噪声 vs 探头伪影”的第一步之一。</text></svg>