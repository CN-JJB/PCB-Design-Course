<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:15px}.card{fill:#fff;stroke:#7893b5;stroke-width:2}.p{fill:#f5efff;stroke:#7b61bf;stroke-width:2}.g{fill:#eef9f1;stroke:#4c9864;stroke-width:2}.o{fill:#fff6e8;stroke:#d59631;stroke-width:2}</style><rect width="1180" height="620" fill="#f8fbff"/><text x="45" y="50" class="t h">Artix-7 Power Tree｜每条 Rail 都有独立角色</text><rect x="465" y="90" width="250" height="80" rx="14" class="card"/><text x="590" y="140" text-anchor="middle" class="t b">5 V Input / Power Front End</text><rect x="70" y="250" width="180" height="115" rx="14" class="p"/><text x="160" y="292" text-anchor="middle" class="t b">1.0 V</text><text x="160" y="323" text-anchor="middle" class="t s">VCCINT / VCCBRAM</text><rect x="285" y="250" width="180" height="115" rx="14" class="g"/><text x="375" y="292" text-anchor="middle" class="t b">1.8 V</text><text x="375" y="323" text-anchor="middle" class="t s">VCCAUX</text><rect x="500" y="250" width="180" height="115" rx="14" class="o"/><text x="590" y="292" text-anchor="middle" class="t b">3.3 V</text><text x="590" y="323" text-anchor="middle" class="t s">Config / GPIO VCCO</text><rect x="715" y="250" width="180" height="115" rx="14" class="p"/><text x="805" y="292" text-anchor="middle" class="t b">1.5 V</text><text x="805" y="323" text-anchor="middle" class="t s">DDR3 / DDR VCCO</text><rect x="930" y="250" width="180" height="115" rx="14" class="g"/><text x="1020" y="292" text-anchor="middle" class="t b">MGT Rails</text><text x="1020" y="323" text-anchor="middle" class="t s">AVCC / AVTT / AUX</text><line x1="590" y1="170" x2="160" y2="250" stroke="#7a8796" stroke-width="3"/><line x1="590" y1="170" x2="375" y2="250" stroke="#7a8796" stroke-width="3"/><line x1="590" y1="170" x2="590" y2="250" stroke="#7a8796" stroke-width="3"/><line x1="590" y1="170" x2="805" y2="250" stroke="#7a8796" stroke-width="3"/><line x1="590" y1="170" x2="1020" y2="250" stroke="#7a8796" stroke-width="3"/><text x="60" y="445" class="t b">Recommended sequencing baseline:</text><text x="350" y="445" class="t h">VCCINT → VCCBRAM → VCCAUX → VCCO</text><text x="60" y="500" class="t s">实际 regulator、电流和电容来自 XPE/Vivado + DS181/UG483，而不是“FPGA 通用电源表”。</text><text x="60" y="540" class="t s">DDR3 还需要 VREF/VTT；启用 GTP 时 analog rails 单独做 sequencing / PI review。</text></svg>