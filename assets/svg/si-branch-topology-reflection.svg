<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
<rect width="1180" height="660" rx="24" fill="#f8fafc"/>
<text x="55" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Branched topology: unequal lengths change reflection timing</text>

<rect x="55" y="90" width="515" height="470" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="85" y="130" font-family="sans-serif" font-size="22" font-weight="700" fill="#991b1b">Unequal T branches</text>
<line x1="95" y1="245" x2="235" y2="245" stroke="#7c3aed" stroke-width="8"/>
<line x1="235" y1="245" x2="235" y2="175" stroke="#7c3aed" stroke-width="8"/>
<line x1="235" y1="175" x2="500" y2="175" stroke="#7c3aed" stroke-width="8"/>
<line x1="235" y1="245" x2="235" y2="330" stroke="#7c3aed" stroke-width="8"/>
<line x1="235" y1="330" x2="405" y2="330" stroke="#7c3aed" stroke-width="8"/>
<circle cx="500" cy="175" r="11" fill="#dc2626"/><circle cx="405" cy="330" r="11" fill="#dc2626"/>
<text x="345" y="160" font-family="sans-serif" font-size="15" fill="#334155">long branch</text>
<text x="290" y="355" font-family="sans-serif" font-size="15" fill="#334155">short branch</text>
<path d="M495 200 C420 235 350 270 245 290" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 5"/>
<path d="M400 350 C350 380 290 360 240 320" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 5"/>
<text x="90" y="420" font-family="sans-serif" font-size="17" fill="#92400e">Reflections return to the tee at</text>
<text x="90" y="448" font-family="sans-serif" font-size="17" fill="#92400e">different times → irregular superposition.</text>
<text x="90" y="495" font-family="sans-serif" font-size="15" fill="#64748b">This may worsen threshold crossings</text>
<text x="90" y="518" font-family="sans-serif" font-size="15" fill="#64748b">for a particular receiver.</text>

<rect x="610" y="90" width="515" height="470" rx="20" fill="#fff" stroke="#cbd5e1"/>
<text x="640" y="130" font-family="sans-serif" font-size="22" font-weight="700" fill="#166534">Symmetric branches in this case</text>
<line x1="650" y1="245" x2="790" y2="245" stroke="#16a34a" stroke-width="8"/>
<line x1="790" y1="245" x2="790" y2="175" stroke="#16a34a" stroke-width="8"/>
<line x1="790" y1="175" x2="1055" y2="175" stroke="#16a34a" stroke-width="8"/>
<line x1="790" y1="245" x2="790" y2="330" stroke="#16a34a" stroke-width="8"/>
<line x1="790" y1="330" x2="1055" y2="330" stroke="#16a34a" stroke-width="8"/>
<circle cx="1055" cy="175" r="11" fill="#16a34a"/><circle cx="1055" cy="330" r="11" fill="#16a34a"/>
<path d="M1050 200 C980 235 905 270 800 290" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 5"/>
<path d="M1050 350 C975 380 895 360 800 320" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 5"/>
<text x="645" y="420" font-family="sans-serif" font-size="17" fill="#166534">Return events become more symmetric;</text>
<text x="645" y="448" font-family="sans-serif" font-size="17" fill="#166534">the video’s ringing was reduced.</text>
<text x="645" y="495" font-family="sans-serif" font-size="15" fill="#64748b">Do not generalize to every topology:</text>
<text x="645" y="518" font-family="sans-serif" font-size="15" fill="#64748b">daisy-chain / fly-by may be better elsewhere.</text>

<rect x="55" y="595" width="1070" height="34" rx="10" fill="#fff7ed"/>
<text x="78" y="618" font-family="sans-serif" font-size="16" fill="#92400e">“Equal length” is meaningful only after topology and timing/reflection goals are defined.</text>
</svg>