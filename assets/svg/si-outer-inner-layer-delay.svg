<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Outer and inner layers can have different propagation delay per millimeter</text><g font-family="sans-serif"><rect x="70" y="100" width="500" height="460" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="105" y="140" font-size="22" font-weight="700" fill="#1d4ed8">Outer / microstrip-like</text><path d="M120 240 H500" stroke="#2563eb" stroke-width="9"/><rect x="120" y="380" width="380" height="35" fill="#475569"/><path d="M140 240 C220 160 320 160 400 240" fill="none" stroke="#22c55e" stroke-width="4"/><path d="M160 240 C240 330 340 330 420 240" fill="none" stroke="#22c55e" stroke-width="4"/><text x="115" y="465" font-size="16" fill="#334155">Field partly samples air / mask + dielectric.</text><rect x="610" y="100" width="500" height="460" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="645" y="140" font-size="22" font-weight="700" fill="#6d28d9">Inner / stripline-like</text><rect x="660" y="175" width="380" height="35" fill="#475569"/><path d="M660 300 H1040" stroke="#7c3aed" stroke-width="9"/><rect x="660" y="420" width="380" height="35" fill="#475569"/><path d="M690 300 C760 235 860 235 930 300" fill="none" stroke="#22c55e" stroke-width="4"/><path d="M690 300 C760 365 860 365 930 300" fill="none" stroke="#22c55e" stroke-width="4"/><text x="655" y="500" font-size="16" fill="#334155">Field is more fully inside PCB dielectric.</text><rect x="95" y="610" width="990" height="42" rx="10" fill="#e2e8f0"/><text x="120" y="637" font-size="16" fill="#334155">For timing-critical groups, use per-layer ps/mm from the actual stackup—not one fixed “FR-4 delay” number.</text></g></svg>