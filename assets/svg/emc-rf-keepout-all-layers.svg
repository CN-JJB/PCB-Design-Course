<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">RF Keepout 不是“只在顶层不铺铜”</text>
<text x="205" y="100" font-family="sans-serif" font-size="22" font-weight="700">四层板俯视：</text>
<rect x="110" y="130" width="980" height="430" rx="20" fill="#f7f7f7" stroke="#333" stroke-width="3"/>
<rect x="780" y="175" width="250" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="905" y="240" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">RF Module</text>
<rect x="960" y="190" width="90" height="120" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1005" y="370" text-anchor="middle" font-family="sans-serif" font-size="18">Antenna keepout</text>
<text x="265" y="205" font-family="sans-serif" font-size="20">L1  Copper  ───────────────╲</text>
<text x="265" y="260" font-family="sans-serif" font-size="20">L2  GND     ─────────────── ╲  ← 这里也要按模块要求让开</text>
<text x="265" y="315" font-family="sans-serif" font-size="20">L3  PWR/GND ─────────────── ╱</text>
<text x="265" y="370" font-family="sans-serif" font-size="20">L4  Copper  ───────────────╱</text>
<text x="265" y="455" font-family="sans-serif" font-size="20">错误直觉：我已经花一整层做 GND，所以它应该“永远连续”。</text>
<text x="265" y="495" font-family="sans-serif" font-size="20">正确理解：天线区域是器件级电磁边界，reference continuity 必须和 antenna requirement 一起审查。</text>
<text x="600" y="620" text-anchor="middle" font-family="sans-serif" font-size="18">真实项目里 keepout 形状与层数必须照模块/天线厂商文档；这里仅用于教学。</text>
</svg>