<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:16px}.sys{fill:#eef5ff;stroke:#527cb5;stroke-width:2}.cab{fill:#fff6eb;stroke:#d39435;stroke-width:2}.iso{stroke:#7a61be;stroke-width:8;stroke-dasharray:10 8}.red{stroke:#d93a3a;stroke-width:5;fill:none;marker-end:url(#a)}.blue{stroke:#2377c8;stroke-width:5;fill:none;marker-end:url(#b)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93a3a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2377c8"/></marker></defs><rect width="1180" height="560" fill="#f8fbff"/><text x="45" y="48" class="t h">Ethernet Boundary｜System GND 与 Cable/Chassis 不是同一个世界</text>
<rect x="45" y="100" width="625" height="365" rx="20" class="sys"/><text x="75" y="140" class="t b">System side</text><rect x="95" y="205" width="170" height="100" rx="12" fill="#fff" stroke="#527cb5"/><text x="180" y="250" text-anchor="middle" class="t b">PHY</text><rect x="380" y="190" width="200" height="130" rx="12" fill="#fff" stroke="#785fc0"/><text x="480" y="242" text-anchor="middle" class="t b">Magnetics</text><text x="480" y="273" text-anchor="middle" class="t s">Isolation</text><path d="M265 255 H380" class="red"/>
<line x1="675" y1="90" x2="675" y2="475" class="iso"/><text x="690" y="120" class="t s">Isolation boundary</text>
<rect x="700" y="100" width="430" height="365" rx="20" class="cab"/><text x="730" y="140" class="t b">Cable / chassis side</text><rect x="820" y="205" width="190" height="105" rx="12" fill="#fff" stroke="#d39435"/><text x="915" y="247" text-anchor="middle" class="t b">RJ45</text><text x="915" y="278" text-anchor="middle" class="t s">shield + cable</text><path d="M580 255 H820" class="red"/>
<path d="M970 365 C850 445 480 470 215 390" class="blue"/><text x="600" y="500" text-anchor="middle" class="t s">Common-mode / ESD return must have an intentional structure; do not assume “GND” magically absorbs it.</text><text x="60" y="535" class="t s">检查：MDI pair、magnetics、shield/chassis、high-voltage capacitor、connector zone、PHY power return。</text></svg>