<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:16px}.z{stroke:#334155;stroke-width:3;rx:20;ry:20}.arrow{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><text x="55" y="55" class="t">V2 Board Zoning：先画功能流，再摆零件</text><rect x="80" y="95" width="1040" height="520" fill="#f8fafc" stroke="#0f172a" stroke-width="4" rx="28"/><rect x="95" y="120" width="235" height="170" fill="#fef3c7" class="z"/><text x="145" y="170" class="h">USB Boundary</text><text x="128" y="205" class="s">USB-C → ESD → Pair</text><text x="128" y="235" class="s">VBUS entry / Shield</text><rect x="395" y="170" width="340" height="270" fill="#dbeafe" class="z"/><text x="485" y="220" class="h">MCU CORE</text><text x="445" y="255" class="s">STM32F407 · VCAP · Decoupling</text><text x="455" y="285" class="s">HSE · Reset · Boot</text><text x="455" y="315" class="s">Critical local loops</text><rect x="830" y="120" width="250" height="170" fill="#dcfce7" class="z"/><text x="900" y="170" class="h">microSD</text><text x="865" y="205" class="s">CLK/CMD/D0-D3</text><text x="865" y="235" class="s">Card power / detect</text><rect x="95" y="390" width="260" height="175" fill="#fee2e2" class="z"/><text x="155" y="440" class="h">CAN Boundary</text><text x="125" y="475" class="s">Connector → TVS/CMC</text><text x="125" y="505" class="s">→ PHY → MCU logic</text><rect x="435" y="480" width="260" height="105" fill="#ffedd5" class="z"/><text x="510" y="525" class="h">POWER</text><text x="470" y="555" class="s">5V entry → 3V3 distribution</text><rect x="830" y="390" width="250" height="175" fill="#ede9fe" class="z"/><text x="905" y="440" class="h">DEBUG</text><text x="865" y="475" class="s">SWD / UART / TP</text><text x="865" y="505" class="s">Physical probe access</text><path d="M330 205 L395 250" class="arrow"/><path d="M830 210 L735 270" class="arrow"/><path d="M355 470 L435 395" class="arrow"/><path d="M830 470 L735 380" class="arrow"/><path d="M565 480 L565 440" class="arrow"/><text x="80" y="660" class="s">布局优先级：机械锚点 → 保护边界 → MCU 黄金位置 → 关键接口 → Power/Test。不要用 Routing 修复坏 Placement。</text></svg>