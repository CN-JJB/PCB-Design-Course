<text x="80" y="285" font-size="20" font-weight="700" fill="#92400e">Each edge contains broad frequency content</text>
<path d="M120 360 C155 305 190 415 225 360 C260 305 295 415 330 360" fill="none" stroke="#f59e0b" stroke-width="5"/>
