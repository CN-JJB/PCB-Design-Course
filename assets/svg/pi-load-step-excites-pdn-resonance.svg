<text x="430" y="425" font-size="17" fill="#334155">Natural ring frequency belongs to the PDN, not to the repetition rate.</text>
<text x="80" y="500" font-size="20" font-weight="700" fill="#991b1b">If edge timing repeatedly reinforces the ring...</text>
<path d="M110 580 C145 490 180 670 215 580 C250 490 285 670 320 580 C355 490 390 670 425 580 C460 490 495 670 530 580 C565 490 600 670 635 580 C670 490 705 670 740 580 C775 490 810 670 845 580 C880 490 915 670 950 580 C985 490 1020 670 1055 580" fill="none" stroke="#dc2626" stroke-width="6"/>
<text x="720" y="645" font-size="17" font-weight="700" fill="#991b1b">rail ringing grows</text>
