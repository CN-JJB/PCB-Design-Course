<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#111827}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.card{stroke:#334155;stroke-width:2;rx:16;ry:16}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="55" y="55" class="t">V2 Routing Priority：先处理最难返工的路径</text><g><rect x="60" y="105" width="190" height="95" fill="#fee2e2" class="card"/><text x="115" y="145" class="h">1 HSE / VCAP</text><text x="90" y="175" class="s">local loop · golden space</text><rect x="300" y="105" width="190" height="95" fill="#fef3c7" class="card"/><text x="350" y="145" class="h">2 USB D+/D-</text><text x="335" y="175" class="s">pair · ESD · reference</text><rect x="540" y="105" width="190" height="95" fill="#dcfce7" class="card"/><text x="590" y="145" class="h">3 SDIO_CLK</text><text x="568" y="175" class="s">source R · aggressor</text><rect x="780" y="105" width="190" height="95" fill="#dbeafe" class="card"/><text x="820" y="145" class="h">4 SDIO BUS</text><text x="810" y="175" class="s">CMD + D0~D3 group</text><rect x="1010" y="105" width="140" height="95" fill="#ede9fe" class="card"/><text x="1030" y="145" class="h">5 CAN</text><text x="1022" y="175" class="s">bus-side first</text><path d="M250 152 L300 152" class="a"/><path d="M490 152 L540 152" class="a"/><path d="M730 152 L780 152" class="a"/><path d="M970 152 L1010 152" class="a"/></g><g><rect x="150" y="320" width="210" height="100" fill="#f1f5f9" class="card"/><text x="195" y="360" class="h">6 Debug / Logic</text><text x="185" y="392" class="s">SWD · UART · CAN logic</text><rect x="490" y="320" width="210" height="100" fill="#ffedd5" class="card"/><text x="545" y="360" class="h">7 Power</text><text x="520" y="392" class="s">3V3 / 5V distribution</text><rect x="830" y="320" width="210" height="100" fill="#f3f4f6" class="card"/><text x="875" y="360" class="h">8 Low-speed</text><text x="860" y="392" class="s">GPIO · LED · Keys</text><path d="M360 370 L490 370" class="a"/><path d="M700 370 L830 370" class="a"/></g><rect x="300" y="505" width="600" height="100" fill="#e0f2fe" class="card"/><text x="445" y="545" class="h">9 Pours · Stitching · Cleanup</text><text x="385" y="578" class="s">最后再敷铜并重新检查 slot / island / return / asymmetry</text><path d="M600 420 L600 505" class="a"/><text x="65" y="650" class="s">优先级不是“宇宙定律”；它的目的，是先保护最敏感、最难移动、最难返工的结构。</text></svg>