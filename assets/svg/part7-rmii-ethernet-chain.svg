<rect x="650" y="140" width="205" height="155" rx="16" class="p"/><text x="752" y="182" text-anchor="middle" class="t b">Magnetics</text><text x="752" y="218" text-anchor="middle" class="t s">isolation</text><text x="752" y="247" text-anchor="middle" class="t s">common-mode</text>
<rect x="935" y="140" width="185" height="155" rx="16" class="o"/><text x="1027" y="182" text-anchor="middle" class="t b">RJ45 / Cable</text><text x="1027" y="218" text-anchor="middle" class="t s">shield · ESD</text><text x="1027" y="247" text-anchor="middle" class="t s">external world</text>
<path d="M275 215 H345" class="red"/><path d="M570 215 H650" class="red"/><path d="M855 215 H935" class="red"/>
<text x="310" y="195" text-anchor="middle" class="t s">RMII</text><text x="610" y="195" text-anchor="middle" class="t s">MDI</text><text x="895" y="195" text-anchor="middle" class="t s">isolated cable</text>
<text x="60" y="385" class="t b">不要混淆：</text><text x="205" y="385" class="t s">RMII 是 single-ended digital；MDI 才是 100 Ω differential channel。</text><text x="60" y="425" class="t s">Placement 需要同时平衡 RMII 路径、MDI 路径、PHY analog supply、magnetics 与 connector boundary。</text></svg>