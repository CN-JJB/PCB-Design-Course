<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"><style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:16px}.box{fill:#fff;stroke:#7893b5;stroke-width:2}.g{fill:#eef9f1;stroke:#4d9a66;stroke-width:2}.o{fill:#fff7e8;stroke:#d89b36;stroke-width:2}.p{fill:#f5efff;stroke:#785fc0;stroke-width:2}.red{stroke:#d93d3d;stroke-width:5;fill:none}</style><rect width="1180" height="500" fill="#f8fbff"/><text x="45" y="50" class="t h">Ethernet Chain｜三个不同电气世界</text>
<rect x="60" y="140" width="215" height="155" rx="16" class="box"/><text x="168" y="182" text-anchor="middle" class="t b">STM32H743 MAC</text><text x="168" y="218" text-anchor="middle" class="t s">RMII LVCMOS</text><text x="168" y="247" text-anchor="middle" class="t s">50 MHz REF_CLK</text>
