<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fbff"/><text x="600" y="50" text-anchor="middle" font-size="32" font-family="sans-serif" font-weight="700" fill="#17324d">Four-layer pressure → Six-layer design freedom</text><g font-family="sans-serif"><rect x="80" y="100" width="470" height="430" rx="24" fill="#fff" stroke="#b8c8d8" stroke-width="2"/><text x="315" y="145" text-anchor="middle" font-size="26" font-weight="700">4 Layer</text><g font-size="18"><rect x="140" y="185" width="350" height="44" rx="10" fill="#d38b2c"/><text x="315" y="214" text-anchor="middle" fill="#fff">L1 · Critical signal + components</text><rect x="140" y="245" width="350" height="44" rx="10" fill="#374957"/><text x="315" y="274" text-anchor="middle" fill="#fff">L2 · Solid GND reference</text><rect x="140" y="305" width="350" height="44" rx="10" fill="#9a71c6"/><text x="315" y="334" text-anchor="middle" fill="#fff">L3 · Power islands / reference pressure</text><rect x="140" y="365" width="350" height="44" rx="10" fill="#d38b2c"/><text x="315" y="394" text-anchor="middle" fill="#fff">L4 · Secondary signal</text></g><text x="315" y="458" text-anchor="middle" font-size="18" fill="#b42318">Routing, reference and power compete</text><text x="315" y="487" text-anchor="middle" font-size="16" fill="#52606d">“Can route” ≠ “Can route correctly”</text><rect x="650" y="100" width="470" height="430" rx="24" fill="#fff" stroke="#8dc49e" stroke-width="2"/><text x="885" y="145" text-anchor="middle" font-size="26" font-weight="700">6 Layer</text><g font-size="17"><rect x="710" y="177" width="350" height="38" rx="9" fill="#d38b2c"/><text x="885" y="202" text-anchor="middle" fill="#fff">L1 · Critical signal</text><rect x="710" y="225" width="350" height="38" rx="9" fill="#374957"/><text x="885" y="250" text-anchor="middle" fill="#fff">L2 · GND reference</text><rect x="710" y="273" width="350" height="38" rx="9" fill="#4d88c7"/><text x="885" y="298" text-anchor="middle" fill="#fff">L3 · Internal signal corridor</text><rect x="710" y="321" width="350" height="38" rx="9" fill="#9a71c6"/><text x="885" y="346" text-anchor="middle" fill="#fff">L4 · Power / plane candidate</text><rect x="710" y="369" width="350" height="38" rx="9" fill="#374957"/><text x="885" y="394" text-anchor="middle" fill="#fff">L5 · GND reference</text><rect x="710" y="417" width="350" height="38" rx="9" fill="#d38b2c"/><text x="885" y="442" text-anchor="middle" fill="#fff">L6 · Secondary signal</text></g><text x="885" y="493" text-anchor="middle" font-size="18" fill="#177245">More reference-aware routing choices</text><path d="M560 315 H640" stroke="#1d6fdc" stroke-width="7" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1d6fdc"/></marker></defs><text x="600" y="292" text-anchor="middle" font-size="16" fill="#1d6fdc">upgrade only when constraints justify it</text></g></svg>