<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Trace geometry: W, T, H and S are coupled variables</text><g font-family="sans-serif"><rect x="130" y="215" width="300" height="55" fill="#f59e0b"/><rect x="650" y="215" width="220" height="55" fill="#f59e0b"/><rect x="110" y="480" width="900" height="40" fill="#475569"/><line x1="130" y1="190" x2="430" y2="190" stroke="#2563eb" stroke-width="3"/><text x="270" y="175" font-size="20" font-weight="700" fill="#1d4ed8">W</text><line x1="90" y1="215" x2="90" y2="270" stroke="#16a34a" stroke-width="3"/><text x="65" y="252" font-size="20" font-weight="700" fill="#166534">T</text><line x1="500" y1="270" x2="500" y2="480" stroke="#7c3aed" stroke-width="3"/><text x="515" y="385" font-size="20" font-weight="700" fill="#6d28d9">H</text><line x1="430" y1="310" x2="650" y2="310" stroke="#dc2626" stroke-width="3"/><text x="530" y="295" font-size="20" font-weight="700" fill="#991b1b">S</text><text x="130" y="575" font-size="17" fill="#334155">W/T ↑ → R↓, current density↓, usually Z0↓</text><text x="130" y="605" font-size="17" fill="#334155">H ↑ → reference coupling↓, field spread↑, usually Z0↑</text><text x="130" y="635" font-size="17" fill="#334155">S ↓ → neighbor coupling↑; differential Zodd / Zdiff also changes</text></g></svg>