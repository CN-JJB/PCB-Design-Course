<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680"><rect width="1180" height="680" rx="24" fill="#f8fafc"/><text x="55" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Differential delay matching: intra-pair and inter-pair are different budgets</text><g font-family="sans-serif"><rect x="70" y="105" width="500" height="440" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="105" y="145" font-size="22" font-weight="700" fill="#991b1b">Intra-pair skew</text><path d="M130 250 H500" stroke="#dc2626" stroke-width="7"/><path d="M130 310 H460" stroke="#2563eb" stroke-width="7"/><path d="M460 310 q20 -30 40 0 q20 30 40 0" fill="none" stroke="#2563eb" stroke-width="7"/><text x="125" y="390" font-size="17" fill="#334155">Compare P vs N arrival time.</text><text x="125" y="425" font-size="16" fill="#475569">Controls differential skew, mode conversion and common-mode generation.</text><rect x="610" y="105" width="500" height="440" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="645" y="145" font-size="22" font-weight="700" fill="#1d4ed8">Inter-pair / lane skew</text><path d="M670 220 H1030" stroke="#dc2626" stroke-width="6"/><path d="M670 250 H1030" stroke="#2563eb" stroke-width="6"/><path d="M670 330 H980" stroke="#dc2626" stroke-width="6"/><path d="M670 360 H980" stroke="#2563eb" stroke-width="6"/><text x="670" y="430" font-size="17" fill="#334155">Compare pair 0 vs pair 1 / clock pair / lane.</text><text x="670" y="465" font-size="16" fill="#475569">Only required when the protocol timing model says so.</text><rect x="90" y="600" width="1000" height="42" rx="10" fill="#e2e8f0"/><text x="115" y="627" font-size="16" fill="#334155">“Differential pairs must be equal length” is incomplete until you name which pair members or lanes are being compared.</text></g></svg>