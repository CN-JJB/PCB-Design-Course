<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="zr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#333"/></marker>
    <pattern id="pwrzone" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff3e0"/><line x1="0" y1="0" x2="10" y2="10" stroke="#ffe0b2" stroke-width="2"/></pattern>
  </defs>
  <rect width="960" height="560" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">项目二布局总图：STM32 最小系统（36×28mm 四层板）</text>

  <g transform="translate(130,66)">
    <rect x="0" y="0" width="700" height="420" rx="10" fill="#f4efe2" stroke="#8a5527" stroke-width="2"/>
    <!-- mounting holes -->
    <circle cx="26" cy="26" r="12" fill="#fff" stroke="#888"/><circle cx="674" cy="26" r="12" fill="#fff" stroke="#888"/>
    <circle cx="26" cy="394" r="12" fill="#fff" stroke="#888"/><circle cx="674" cy="394" r="12" fill="#fff" stroke="#888"/>

    <!-- USB + power chain top -->
    <rect x="60" y="24" width="86" height="44" rx="4" fill="#78909c"/>
    <text x="103" y="52" text-anchor="middle" font-size="13.5" fill="#fff">USB-C</text>
    <rect x="170" y="30" width="56" height="32" fill="#5c6bc0"/><text x="198" y="51" text-anchor="middle" font-size="12.5" fill="#fff">F1保险丝</text>
    <rect x="252" y="26" width="92" height="40" fill="#43a047"/><text x="298" y="51" text-anchor="middle" font-size="13.5" fill="#fff">AMS1117</text>
    <rect x="368" y="34" width="34" height="26" fill="#5c6bc0"/><text x="385" y="52" text-anchor="middle" font-size="11.5" fill="#fff">22μF</text>
    <path d="M150,46 h16 M228,46 h20 M346,46 h18" stroke="#8a5527" stroke-width="3"/>
    <text x="255" y="88" font-size="13" fill="#555">电源链一条直线：USB→保护→LDO→输出电容</text>

    <!-- crystal zone -->
    <rect x="300" y="118" width="110" height="64" fill="#e3f2fd" stroke="#64b5f6" stroke-dasharray="6,4"/>
    <rect x="318" y="136" width="42" height="24" fill="#37474f"/><text x="339" y="153" text-anchor="middle" font-size="11.5" fill="#fff">8MHz</text>
    <circle cx="382" cy="148" r="9" fill="#5c6bc0"/><circle cx="382" cy="168" r="9" fill="#5c6bc0"/>
    <text x="355" y="112" text-anchor="middle" font-size="12.5" fill="#1565c0">晶振 3mm 净空圈</text>

    <!-- MCU -->
    <rect x="290" y="196" width="150" height="150" fill="#37474f" rx="6"/>
    <text x="365" y="264" text-anchor="middle" font-size="17" fill="#fff">MCU</text>
    <text x="365" y="288" text-anchor="middle" font-size="12.5" fill="#b0bec5">LQFP48</text>
    <!-- decoupling ring -->
    <g fill="#5c6bc0">
      <rect x="266" y="206" width="18" height="14"/><rect x="266" y="248" width="18" height="14"/><rect x="266" y="300" width="18" height="14"/>
      <rect x="446" y="206" width="18" height="14"/><rect x="446" y="248" width="18" height="14"/><rect x="446" y="300" width="18" height="14"/>
      <rect x="320" y="352" width="18" height="14"/><rect x="392" y="352" width="18" height="14"/>
    </g>
    <text x="500" y="232" font-size="12.5" fill="#3949ab">去耦阵环绕</text>
    <text x="500" y="252" font-size="12.5" fill="#3949ab">每颗≤2mm 双孔落地</text>

    <!-- SWD -->
    <rect x="600" y="120" width="72" height="40" fill="#78909c"/><text x="636" y="145" text-anchor="middle" font-size="12.5" fill="#fff">SWD 4P</text>
    <!-- BOOT -->
    <rect x="480" y="330" width="60" height="26" fill="#8d6e63"/><text x="510" y="348" text-anchor="middle" font-size="12" fill="#fff">BOOT R</text>
    <!-- RESET -->
    <rect x="120" y="210" width="58" height="34" fill="#8d6e63"/><text x="149" y="232" text-anchor="middle" font-size="12" fill="#fff">RESET</text>
    <!-- LED -->
    <circle cx="160" cy="300" r="10" fill="#e53935"/><text x="160" y="330" text-anchor="middle" font-size="12" fill="#c62828">LED+R</text>
    <!-- W25Q footprint -->
    <rect x="120" y="352" width="90" height="36" fill="#90a4ae" stroke-dasharray="5,4"/><text x="165" y="375" text-anchor="middle" font-size="12" fill="#37474f">W25Q64 预留位</text>
    <!-- GPIO headers bottom right -->
    <rect x="580" y="340" width="96" height="30" fill="#78909c"/><text x="628" y="360" text-anchor="middle" font-size="12" fill="#fff">GPIO 双排针</text>
    <!-- version silk -->
    <text x="30" y="408" font-size="13" fill="#555">STM32_MIN_SYS v1.0</text>
  </g>
  <text x="480" y="524" text-anchor="middle" font-size="14" fill="#333">布局口诀：接口贴墙、讲台居中、水管直达、学霸区安静 —— 对应四大原则的教室座位表模型</text>
  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#999">配套：《06_实战项目/02_STM32F103最小系统》第 6 节 ＆ 《03_二层板实战/02_布局方法论》</text>
</svg>
